function generateDigest(papers, profile) {
  const now = new Date().toLocaleDateString("en-GB", { day:"numeric", month:"long", year:"numeric" });
  const newCount = papers.filter(p => p._new).length;
  let t = `${profile.name} — Literature Digest\n${now} — Last ${profile.lookbackDays} days — ${papers.length} papers (${newCount} new)\n${"=".repeat(55)}\n\n`;
  papers.forEach((p, i) => {
    const tier = p._score >= 10 ? "HIGH" : p._score >= 5 ? "MED" : "LOW";
    const why = (p._reasons || []).filter(r => r.tier !== "Diversity").slice(0, 3).map(r => r.kw).join("; ");
    t += `[${i+1}] [${tier}]${p._new ? " [NEW]" : ""} ${p.title}\n`;
    t += `  ${(p.authors||"").slice(0,120)}${(p.authors||"").length > 120 ? "…" : ""}\n`;
    t += `  ${p.source} | ${p.date} | Score ${p._score}${why ? ` | ${why}` : ""}\n`;
    t += `  ${p.doi ? `https://doi.org/${p.doi}` : p.url}\n\n`;
  });
  return t;
}

async function copyText(text, okMsg) {
  try {
    await navigator.clipboard.writeText(text);
    state.message = { type: "success", text: okMsg };
  } catch {
    state.message = { type: "warn", text: "Clipboard access was blocked by the browser — select and copy manually." };
  }
  render();
}

function emailDigest() {
  const papers = visiblePapers();
  if (!papers.length) return;
  const digest = generateDigest(papers, state.profile);
  const subj = encodeURIComponent(`${state.profile.name} — Lit Digest — ${new Date().toLocaleDateString("en-GB")}`);
  const recipients = splitList(state.profile.emailRecipients).map(encodeURIComponent).join(",");
  // mailto bodies are length-limited in most mail clients; the full digest goes to the clipboard
  const body = digest.length > 1800 ? digest.slice(0, 1800) + "\n\n[…truncated — paste the full digest from your clipboard]" : digest;
  copyText(digest, "Full digest copied to clipboard. Email client opening…");
  window.location.href = `mailto:${recipients}?subject=${subj}&body=${encodeURIComponent(body)}`;
}

// BibTeX for reference managers (Zotero, Mendeley, EndNote all import it)
function toBibtex(papers) {
  const used = new Set();
  return papers.map(p => {
    const first = foldAccents((p.authors || "").split(",")[0] || "anon").trim().split(/\s+/).pop().replace(/[^A-Za-z]/g, "") || "anon";
    const year = (p.date || "").slice(0, 4) || "nd";
    let key = `${first}${year}`; let n = 0;
    while (used.has(key)) key = `${first}${year}${String.fromCharCode(97 + n++)}`;
    used.add(key);
    const f = s => String(s || "").replace(/[{}]/g, "");
    const authors = (p.authors || "").split(/\s*,\s*/).filter(Boolean).join(" and ");
    return `@article{${key},\n  title = {${f(p.title)}},\n  author = {${f(authors)}},\n  journal = {${f(p.source)}},\n  year = {${year}},\n` +
      (p.doi ? `  doi = {${f(p.doi)}},\n` : "") + `  url = {${f(p.doi ? "https://doi.org/" + p.doi : p.url)}}\n}`;
  }).join("\n\n");
}

// Escapes for both text and attribute contexts (quotes included)
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
// Only allow http(s) links — AI-returned URLs are untrusted
const safeUrl = u => /^https?:\/\//i.test(String(u || "").trim()) ? String(u).trim() : "#";
const $ = id => document.getElementById(id);

function render() {
  // Capture focus state before re-rendering, so we can restore it after
  const focused = document.activeElement;
  let focusInfo = null;
  if (focused && focused.tagName === "INPUT") {
    if (focused.classList.contains("kw-input")) {
      focusInfo = { type: "kw-input", tier: focused.dataset.tier };
    } else if (focused.id) {
      focusInfo = { type: "id", id: focused.id, selectionStart: focused.selectionStart, selectionEnd: focused.selectionEnd };
    }
  }

  // Header
  const p = state.profile;
  const kwCount = p ? Object.values(p.tiers).reduce((s,t) => s + (t.keywords||[]).length, 0) : 0;
  $("header-sub").textContent = p ? `${p.name} · ${p.authors?.length||0} authors · ${kwCount} keywords` : "No profile";

  // Profile select
  const sel = $("profile-select");
  let selHtml = state.profiles.map(n => `<option value="${esc(n)}" ${n===state.activeProfile?"selected":""}>${esc(n)}</option>`).join("");
  if (state.isDraft) {
    selHtml = `<option value="" selected>📝 Unsaved Draft</option>` + selHtml;
  }
  sel.innerHTML = selHtml;

  // Tabs
  const resultCount = state.results?.length || 0;
  document.querySelectorAll(".tab[data-tab]").forEach(t => {
    t.classList.toggle("active", t.dataset.tab === state.view);
    if (t.dataset.tab === "results") t.textContent = resultCount > 0 ? `Results (${resultCount})` : "Results";
  });

  // Content
  const c = $("content");
  if (state.view === "results") c.innerHTML = renderResults();
  else if (state.view === "config") c.innerHTML = renderConfig();
  else if (state.view === "email") c.innerHTML = renderEmail();

  bindEvents();

  // Restore focus if an input was focused before re-render
  if (focusInfo) {
    let el = null;
    if (focusInfo.type === "kw-input") {
      el = document.querySelector(`.kw-input[data-tier="${focusInfo.tier}"]`);
    } else if (focusInfo.type === "id") {
      el = document.getElementById(focusInfo.id);
    }
    if (el) {
      el.focus({preventScroll: true});
      if (focusInfo.selectionStart != null && el.setSelectionRange) {
        try { el.setSelectionRange(focusInfo.selectionStart, focusInfo.selectionEnd); } catch(e) {}
      }
    }
  }
  // Note: AI Suggest button uses inline onclick="aiSuggestKeywords()" — no direct binding needed
}

// Papers shown in the current list mode + text filter (also what Copy/Email/Export use)
function visiblePapers() {
  const m = state.marks;
  let list = state.listMode === "starred"
    ? Object.values(m.starred).sort((a, b) => (b._starredAt || 0) - (a._starredAt || 0))
    : (state.results || []).filter(p => {
        const k = paperKey(p);
        if (state.listMode === "hidden") return !!m.hidden[k];
        if (m.hidden[k]) return false;
        return state.listMode === "new" ? p._new : true;
      });
  const q = foldAccents(state.filterText || "").toLowerCase().trim();
  if (q) {
    const terms = q.split(/\s+/);
    list = list.filter(p => {
      const hay = foldAccents(`${p.title} ${p.authors} ${p.source} ${p.abstract} ${(p._reasons || []).map(r => r.kw).join(" ")}`).toLowerCase();
      return terms.every(t => hay.includes(t));
    });
  }
  if (state.sortBy === "date") list = [...list].sort((a, b) => (b.date || "").localeCompare(a.date || "") || b._score - a._score);
  return list;
}

function renderResults() {
  let html = "";
  // Controls
  html += `<div class="flex gap-2 mt-3 mb-4" style="flex-wrap:wrap;align-items:center">`;
  html += `<button class="btn btn-primary" id="btn-search" ${state.searching || state.isDraft ?"disabled":""}>${state.results ? "↻ Refresh Search" : "▶ Run Search"}</button>`;
  if (state.searchDate) html += `<span style="font-size:12px;color:var(--muted);font-family:var(--font-mono)">Last: ${new Date(state.searchDate).toLocaleDateString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})} · ${state.profile.lookbackDays}-day window</span>`;
  html += `</div>`;

  if (state.message) html += `<div class="alert alert-${esc(state.message.type)}">${esc(state.message.text)}</div>`;
  if (state.pipelineInfo && !state.searching) html += `<div style="font-family:var(--font-mono);font-size:11px;color:var(--muted);margin:-8px 0 16px 2px">Pipeline: ${esc(state.pipelineInfo)}</div>`;

  if (state.searching) {
    html += `<div class="card text-center"><div class="spinner"></div>`;
    html += `<div style="font-weight:600;color:var(--navy);margin-bottom:6px">${esc(state.progress.label)}</div>`;
    html += `<div style="font-size:12px;color:var(--muted)">${state.progress.current} of ${state.progress.total} sources finished</div>`;
    html += `<div class="progress-bar"><div class="progress-fill" style="width:${(state.progress.current/Math.max(state.progress.total,1))*100}%"></div></div>`;
    html += `<div class="source-grid">`;
    for (const [name, s] of Object.entries(state.sourceStatus || {})) {
      const txt = s.status === "running" ? "…" : s.status === "error" ? "failed" : `${s.count}`;
      html += `<span class="source-chip ${s.status}" title="${esc(s.error || s.note || "")}">${esc(name)}: ${esc(txt)}</span>`;
    }
    html += `</div>`;
    html += `<div style="font-size:11px;color:#aaa;margin-top:10px">Only papers that exist in a real database are shown</div></div>`;
    return html;
  }

  if (!state.results && state.listMode !== "starred") {
    html += `<div class="card text-center" style="padding:40px">`;
    html += `<div style="font-size:40px;margin-bottom:16px">🔬</div>`;
    html += `<h2 style="font-family:var(--font-head);font-size:20px;color:var(--navy);margin-bottom:8px">Ready to Search</h2>`;
    html += `<p style="color:var(--muted);max-width:440px;margin:0 auto 16px;line-height:1.5">Click <strong>Run Search</strong> to find papers from the last ${state.profile.lookbackDays} days. Every result links to its real source — no hallucinated papers.</p>`;
    html += `<div style="font-family:var(--font-mono);font-size:12px;color:#aaa">`;
    const direct = "bioRxiv · PubMed · Europe PMC · OpenAlex · CrossRef · Semantic Scholar";
    html += state.searchMode === "direct" ? direct : state.searchMode === "gemini" ? direct + " + Gemini" : state.searchMode === "anthropic" ? direct + " + Claude" : direct + " + Gemini + Claude";
    html += `</div></div>`;
    if (Object.keys(state.marks.starred).length) html += renderListBar([]);
    return html;
  }

  const visible = visiblePapers();
  html += renderListBar(visible);

  if (!visible.length) {
    const why = state.filterText ? "No papers match the filter."
      : state.listMode === "new" ? "Nothing new since your last search."
      : state.listMode === "starred" ? "No starred papers yet — click ☆ on a paper to keep it in your reading list."
      : state.listMode === "hidden" ? "No hidden papers."
      : "No papers matched this window. Normal for niche fields — try expanding the lookback or keywords.";
    html += `<div class="card text-center" style="color:var(--muted)">${why}</div>`;
    return html;
  }

  const renderCard = p => {
    const k = paperKey(p);
    const cls = p._score >= 10 ? "high" : p._score >= 5 ? "med" : "low";
    const starred = !!state.marks.starred[k], hidden = !!state.marks.hidden[k];
    let g = `<div class="paper-card ${cls}">`;
    g += `<div class="paper-head"><a href="${esc(safeUrl(p.url))}" target="_blank" rel="noopener" class="paper-title">${p._new ? `<span class="badge-new">NEW</span>` : ""}${esc(p.title)}</a>`;
    g += `<div class="paper-actions">`;
    g += `<button class="icon-btn ${starred ? "on" : ""}" data-star="${esc(k)}" title="${starred ? "Remove from reading list" : "Save to reading list"}">${starred ? "★" : "☆"}</button>`;
    g += `<button class="icon-btn" data-hide="${esc(k)}" title="${hidden ? "Show again" : "Not relevant — hide"}">${hidden ? "↺" : "✕"}</button>`;
    g += `</div></div>`;
    g += `<div class="paper-authors">${esc((p.authors||"").slice(0,180))}${(p.authors||"").length>180?"…":""}</div>`;
    g += `<div class="paper-meta">`;
    g += `<span class="badge badge-source" title="${esc((p._sources || [p.source]).join(" · "))}">${esc(p.source)}</span>`;
    if ((p._sources || []).length > 1) g += `<span title="${esc(p._sources.join(" · "))}">+${p._sources.length - 1} source${p._sources.length > 2 ? "s" : ""}</span>`;
    g += `<span>${esc(p.date)}</span>`;
    if (p._score != null) g += `<span class="badge badge-score-${cls}">Score: ${p._score}</span>`;
    if (p.doi) g += `<a href="https://doi.org/${esc(encodeURI(p.doi))}" target="_blank" rel="noopener" style="color:#94a3b8">DOI: ${esc(p.doi)}</a>`;
    g += `<button class="btn-review" data-review-key="${esc(k)}">📖 Review</button>`;
    g += `</div>`;
    if (p._reasons?.length) {
      g += `<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:4px">`;
      p._reasons.slice(0,6).forEach(r => {
        const c = r.tier.startsWith("Author") ? "var(--purple)"
          : r.tier==="Diversity" ? "#b15968"
          : r.tierKey === "tier1" || r.tier===state.profile.tiers.tier1?.label ? "var(--green)"
          : r.tierKey === "tier2" || r.tier===state.profile.tiers.tier2?.label ? "var(--blue)"
          : "var(--amber)";
        g += `<span class="tag" style="background:color-mix(in srgb, ${c} 8%, transparent);color:${c};border:1px solid color-mix(in srgb, ${c} 20%, transparent)">${esc(r.tier)}: ${esc(r.kw)} <b>+${r.sc}</b></span>`;
      });
      g += `</div>`;
    }
    if (p.abstract) {
      const short = p.abstract.length > 250;
      g += `<div class="paper-abstract" data-full="${short?0:1}" style="max-height:${short?"62px":"none"}">${esc(p.abstract)}</div>`;
      if (short) g += `<button class="toggle-abstract">Show more</button>`;
    }
    g += `</div>`;
    return g;
  };

  if (state.listMode === "starred" || state.sortBy === "date") {
    // Reading list and date sort are one continuous list
    html += visible.map(renderCard).join("");
  } else {
    // Papers by watched authors with no topic keyword get their own section, so they don't crowd the topical ones
    const authorOnly = visible.filter(p => p._hasAuthor && !p._hasCoreKw);
    const topical = visible.filter(p => !(p._hasAuthor && !p._hasCoreKw));
    const groups = [
      [topical.filter(p => p._score >= 10), "HIGH RELEVANCE", "var(--green)"],
      [topical.filter(p => p._score >= 5 && p._score < 10), "MEDIUM RELEVANCE", "var(--blue)"],
      [topical.filter(p => p._score < 5), "BROADER INTEREST", "var(--amber)"],
      [authorOnly, "WATCHED AUTHORS · OTHER TOPICS", "var(--purple)"]
    ];
    for (const [papers, label, color] of groups) {
      if (!papers.length) continue;
      html += `<h3 class="section-head" style="color:${color};border-bottom-color:${color}">${label} (${papers.length})</h3>`;
      html += papers.map(renderCard).join("");
    }
  }

  html += `<div class="alert alert-info" style="margin-top:24px;font-family:var(--font-mono);font-size:12px"><strong>How scoring works:</strong> exact keyword phrase = full tier points, all words present = half, phrase in title = ×1.5, several different keywords = diversity bonus, watched author = +${state.profile.authorScore}. Click any title to verify at source.</div>`;
  return html;
}

function renderListBar(visible) {
  const res = state.results || [];
  const m = state.marks;
  const counts = {
    all: res.filter(p => !m.hidden[paperKey(p)]).length,
    new: res.filter(p => p._new && !m.hidden[paperKey(p)]).length,
    starred: Object.keys(m.starred).length,
    hidden: res.filter(p => m.hidden[paperKey(p)]).length
  };
  const labels = { all: "All", new: "New", starred: "★ Reading list", hidden: "Hidden" };
  let h = `<div class="list-bar">`;
  h += `<div class="seg">`;
  for (const mode of ["all", "new", "starred", "hidden"]) {
    if (mode === "hidden" && !counts.hidden && state.listMode !== "hidden") continue;
    h += `<button class="seg-btn ${state.listMode === mode ? "active" : ""}" data-list-mode="${mode}">${labels[mode]} <span>${counts[mode]}</span></button>`;
  }
  h += `</div>`;
  h += `<input type="text" id="filter-input" placeholder="Filter…" title="Filter by word, author or journal" value="${esc(state.filterText)}" style="flex:1 1 120px;min-width:120px;width:auto;padding:7px 12px">`;
  h += `<button class="btn btn-secondary btn-sm" id="btn-toggle-sort" title="Toggle sort order">Sort: ${state.sortBy === "score" ? "Score" : "Date"}</button>`;
  if (visible.length) {
    h += `<button class="btn btn-secondary btn-sm" id="btn-copy" title="Copy a plain-text digest of the papers shown">📋 Digest</button>`;
    h += `<button class="btn btn-secondary btn-sm" id="btn-email-now" title="Email the papers shown">📧 Email</button>`;
    h += `<button class="btn btn-secondary btn-sm" id="btn-bibtex" title="Copy BibTeX for the papers shown (Zotero: File → Import from Clipboard)">⧉ BibTeX</button>`;
  }
  h += `</div>`;
  return h;
}

function renderConfig() {
  const p = state.profile;
  let h = `<div style="padding-top:16px">`;
  if (state.isDraft) {
    h += `<div class="alert alert-info" style="margin-top:0;display:flex;align-items:center;gap:10px"><span style="font-size:18px">📝</span><div><strong>New Profile Draft</strong> — not yet saved. Fill in the name and details, then click <strong>💾 Save Profile</strong> at the bottom.</div></div>`;
    h += `<h2 style="font-family:var(--font-head);font-size:20px;color:var(--navy);margin-bottom:4px">Create Profile</h2>`;
  } else {
    h += `<h2 style="font-family:var(--font-head);font-size:20px;color:var(--navy);margin-bottom:4px">Configure Profile</h2>`;
  }
  h += `<p style="font-size:13px;color:var(--muted);margin-bottom:16px;font-family:var(--font-mono)">Edit topics, authors, scoring. Lab mates: create a new profile for your field.</p>`;

  // Profile basics
  h += `<div class="card cfg-card">`;
  h += `<div class="card-title">Profile</div>`;

  h += `<label class="field">Description<span class="hint">One sentence on your research area — used by AI keyword suggestions and AI search.</span><input type="text" id="cfg-desc" value="${esc(p.description)}" placeholder="e.g. X-ray nanoholotomography for connectomics"></label>`;
  h += `<div class="row-inline">`;
  h += `<button class="btn btn-sm btn-gold" id="btn-ai-suggest-kw" onclick="aiSuggestKeywords()">✨ AI Suggest Keywords</button>`;
  if (!state.geminiKey) h += `<span class="hint" style="margin:0">Needs a Gemini key (see AI below)</span>`;
  h += `</div></div>`;

  // Search settings
  h += `<div class="card cfg-card">`;
  h += `<div class="card-title">Search &amp; scoring</div>`;
  h += `<div class="grid-3">`;
  h += `<label class="field">Lookback (days)<input type="number" id="cfg-days" value="${p.lookbackDays}" min="1" max="90"></label>`;
  h += `<label class="field">Min score<input type="number" id="cfg-minscore" value="${p.minScore}" min="0" max="50"></label>`;
  h += `<label class="field">Author score<input type="number" id="cfg-authscore" value="${p.authorScore}" min="0" max="50"></label>`;
  h += `</div>`;
  h += `<label class="field">Extra broad search terms<span class="hint">Short terms sent to the databases to widen recall (comma-separated). Not used for scoring — papers still need a tier keyword or a watched author.</span><input type="text" id="cfg-extraterms" value="${esc(p.extraSearchTerms || "")}" placeholder="e.g. holotomography, ptychography"></label>`;
  h += `<label class="field">OpenAlex API key <span class="card-sub" style="margin-left:4px">recommended</span><span class="hint">Free from <a href="https://openalex.org" target="_blank" rel="noopener">openalex.org</a> (sign in → API key). Without one, everyone on your network shares a small daily budget, which can run out.</span><input type="password" class="mono" autocomplete="off" id="cfg-openalexkey" value="${esc(state.openalexKey)}" placeholder="optional"></label>`;
  h += `<label class="field">bioRxiv categories to scan<span class="hint">Every new preprint in these subjects is scored (comma-separated, as named on bioRxiv). Leave empty to scan all subjects (slower).</span><input type="text" id="cfg-biorxiv" value="${esc(p.biorxivCategories || "")}" placeholder="neuroscience, biophysics, bioengineering"></label>`;
  h += `</div>`;

  // AI search + keys
  h += `<div class="card cfg-card">`;
  h += `<div class="card-title">AI assistance <span class="card-sub">optional</span></div>`;
  h += `<div class="field">Search mode<div class="seg" style="flex-wrap:wrap">`;
  const modeLabels = { direct: "Databases only", gemini: "+ Gemini", anthropic: "+ Claude", both: "+ Gemini & Claude" };
  ["direct","gemini","anthropic","both"].forEach(m => {
    h += `<label class="seg-btn ${state.searchMode===m?"active":""}"><input type="radio" name="searchmode" value="${m}" ${state.searchMode===m?"checked":""} hidden>${modeLabels[m]}</label>`;
  });
  h += `</div></div>`;
  h += `<div class="grid-2">`;
  h += `<label class="field">Gemini API key<span class="hint">Free from <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com</a></span><input type="password" class="mono" autocomplete="off" id="cfg-geminikey" value="${esc(state.geminiKey)}" placeholder="AIza…"></label>`;
  h += `<label class="field">Gemini model<span class="hint">Falls back to “${GEMINI_FALLBACK_MODEL}” if retired</span><input type="text" class="mono" id="cfg-geminimodel" value="${esc(state.geminiModel)}" placeholder="${DEFAULT_GEMINI_MODEL}"></label>`;
  h += `</div>`;
  h += `<label class="field">Anthropic API key<span class="hint">From <a href="https://console.anthropic.com" target="_blank" rel="noopener">console.anthropic.com</a> — billed separately from Claude Team/Pro plans. Used for Claude search and reviews.</span><input type="password" class="mono" autocomplete="off" id="cfg-apikey" value="${esc(state.apiKey)}" placeholder="sk-ant-…"></label>`;
  h += `<div class="hint" style="margin:0">Keys stay in this browser (localStorage) and are only sent to Google / Anthropic.</div>`;
  h += `</div>`;

  // Show AI suggestions if available
  if (state.kwSuggestions) {
    h += `<div class="card" style="border:2px solid var(--gold);margin-bottom:16px">`;
    h += `<div class="card-title" style="margin-bottom:8px">✨ AI keyword suggestions</div>`;
    h += `<div style="font-size:12px;color:var(--muted);margin-bottom:12px">Click a keyword to add it to the tier. Click "Dismiss" when done.</div>`;
    for (const [tierKey, suggestions] of Object.entries(state.kwSuggestions)) {
      const tier = p.tiers[tierKey];
      if (!tier || !Array.isArray(suggestions) || !suggestions.length) continue;
      const existing = new Set(tier.keywords.map(k => k.toLowerCase()));
      if (!Array.isArray(suggestions)) continue;
      const novel = [...new Set(suggestions.filter(s => typeof s === "string" && s.trim()).map(s => s.trim()))].filter(s => !existing.has(s.toLowerCase()));
      if (!novel.length) continue;
      h += `<div style="margin-bottom:10px"><span style="font-weight:600;color:${tier.color};font-size:12px">${tier.label}:</span></div>`;
      h += `<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px">`;
      novel.forEach(kw => {
        h += `<button class="kw-tag" data-accept-kw="${tierKey}:::${esc(kw)}" style="background:${tier.color}12;color:${tier.color};border:1px dashed ${tier.color}50;cursor:pointer;font-size:11px">+ ${esc(kw)}</button>`;
      });
      h += `</div>`;
    }
    h += `<button class="btn btn-sm btn-secondary" id="btn-dismiss-suggestions">Dismiss</button>`;
    h += `</div>`;
  }

  // Tiers
  for (const [tierKey, tier] of Object.entries(p.tiers)) {
    h += `<div class="config-section">`;
    h += `<div class="config-header" style="background:${tier.color}0a">`;
    h += `<span style="font-weight:600;color:${tier.color};font-size:13px">${esc(tier.label)} <span style="font-weight:400;color:var(--muted);font-size:11px">+${tier.score}pts · ${tier.keywords.length} keywords</span></span>`;
    h += `</div><div class="config-body">`;
    h += `<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px">`;
    tier.keywords.forEach((kw, i) => {
      h += `<span class="kw-tag" style="background:${tier.color}12;color:${tier.color};border:1px solid ${tier.color}30">${esc(kw)}<button class="kw-remove" data-tier="${tierKey}" data-idx="${i}">×</button></span>`;
    });
    h += `</div>`;
    h += `<div class="flex gap-2"><input type="text" class="kw-input" data-tier="${tierKey}" placeholder="Add keyword phrase… (Enter to add)"><button class="btn btn-sm" style="background:${tier.color};color:#fff" data-add-tier="${tierKey}">Add</button></div>`;
    h += `</div></div>`;
  }

  // Authors
  h += `<div class="config-section">`;
  h += `<div class="config-header" style="background:color-mix(in srgb, var(--purple) 6%, transparent)">`;
  h += `<span style="font-weight:600;color:var(--purple);font-size:13px">Watched Authors <span style="font-weight:400;color:var(--muted);font-size:11px">+${p.authorScore}pts · ${p.authors.length} authors</span></span>`;
  h += `</div><div class="config-body" style="max-height:350px;overflow-y:auto">`;
  // Info banner about OpenAlex IDs
  const authorsWithIds = p.authors.filter(a => a.openalexId).length;
  const authorsWithoutIds = p.authors.length - authorsWithIds;
  if (authorsWithoutIds > 0) {
    h += `<div style="background:rgba(176,141,87,0.07);border:1px solid rgba(176,141,87,0.3);border-radius:6px;padding:10px 14px;margin-bottom:12px;font-size:12px;color:#6b4f24;line-height:1.5">
      <strong>${authorsWithoutIds} author${authorsWithoutIds>1?"s":""} without OpenAlex ID</strong> — click <strong>🔍 Find ID</strong> next to each name for exact disambiguation. Without an ID, matching is by name only and may produce false positives (e.g., "Lohse M." ≠ "Leon Merten Lohse").
      <button class="btn btn-sm btn-gold" id="btn-bulk-find-ids" style="margin-top:8px;font-size:12px;padding:5px 12px">⚡ Auto-resolve all (uses best match for each)</button>
    </div>`;
  }
  p.authors.forEach((a, i) => {
    const idBadge = a.openalexId
      ? `<a href="${esc(safeUrl(a.openalexId))}" target="_blank" rel="noopener" style="background:#ecfdf5;color:var(--green);padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;font-family:var(--font-mono);text-decoration:none" title="Linked to OpenAlex ${esc(oaShortId(a.openalexId))} — click to check the profile">✓ ${esc(oaShortId(a.openalexId))}</a><button class="btn-find-id" data-find-id="${i}" title="Pick a different OpenAlex author" style="background:none;border:1px solid var(--border);color:var(--muted);padding:2px 6px;border-radius:10px;font-size:10px;cursor:pointer">change</button>`
      : `<button class="btn-find-id" data-find-id="${i}" style="background:#fffbeb;color:var(--amber);border:1px solid #fde68a;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;font-family:var(--font-mono);cursor:pointer">🔍 Find ID</button>`;
    h += `<div class="author-row"><span style="font-weight:500;min-width:130px">${esc(a.last)}, ${esc(a.first)}${a.middle ? " "+esc(a.middle).charAt(0)+"." : ""}</span><span style="color:var(--muted);font-size:11px;flex:1">${esc(a.aff)} — ${esc(a.note)}</span>${idBadge}<button class="kw-remove" data-rm-author="${i}">×</button></div>`;

    // Show lookup candidates inline if this author is being looked up
    if (state.idLookup?.authorIdx === i) {
      h += `<div style="background:var(--bg-alt);border:1px solid var(--border);border-radius:8px;padding:12px;margin:6px 0 12px;font-size:12px">`;
      // Custom search input
      h += `<div class="flex gap-2" style="margin-bottom:10px">`;
      h += `<input type="text" class="lookup-search" data-lookup-idx="${i}" placeholder="Try: '${esc(a.last)} ${esc(a.aff || "institution")}'" value="${esc(state.idLookup.customQuery || '')}" style="flex:1;font-size:12px;padding:6px 10px">`;
      h += `<button class="btn btn-sm" data-lookup-retry="${i}" style="background:var(--teal);color:#fff;white-space:nowrap">Search</button>`;
      h += `</div>`;
      if (state.idLookup.loading) {
        h += `<div style="text-align:center;padding:10px;color:var(--muted)"><div class="spinner" style="width:20px;height:20px;border-width:2px"></div>Searching OpenAlex…</div>`;
      } else if (state.idLookup.candidates?.length === 0) {
        h += `<div style="color:var(--muted);padding:6px">No candidates found. Try adding the institution name, a different spelling, or just the last name.</div>`;
      } else if (state.idLookup.candidates) {
        h += `<div style="font-weight:600;margin-bottom:8px;color:var(--navy)">Pick the right ${esc(a.first)} ${esc(a.last)}:</div>`;
        state.idLookup.candidates.forEach((c, ci) => {
          h += `<div class="lookup-candidate" data-pick-id="${i}|${ci}" style="background:var(--card);border:1px solid var(--border);border-radius:6px;padding:8px 12px;margin-bottom:6px;cursor:pointer;transition:all 0.15s">
            <div style="font-weight:600;font-size:13px">${esc(c.name)}</div>
            <div style="color:var(--muted);font-size:11px;font-family:var(--font-mono);margin-top:3px">${esc(c.hint || "—")}</div>
            <div style="color:#aaa;font-size:10px;font-family:var(--font-mono);margin-top:3px">${c.works} works · ${c.cited} citations · ${esc(c.shortId)}${c.orcid ? " · ORCID ✓" : ""}</div>
          </div>`;
        });
      }
      h += `<button class="btn btn-sm btn-secondary" data-cancel-lookup="1" style="margin-top:4px">Cancel</button>`;
      if (state.geminiKey) {
        h += ` <button class="btn btn-sm" data-ai-verify="${i}" style="background:var(--gold);color:#fff;margin-top:4px">🤖 AI Verify</button>`;
      }
      // Manual ID entry
      h += `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">`;
      h += `<div style="font-size:11px;color:var(--muted);margin-bottom:6px">Or paste an OpenAlex URL, ID, or ORCID:</div>`;
      h += `<div class="flex gap-2">`;
      h += `<input type="text" class="manual-id-input" data-manual-idx="${i}" placeholder="https://openalex.org/A... or 0000-0002-..." style="flex:1;font-size:11px;padding:6px 10px">`;
      h += `<button class="btn btn-sm" data-set-manual-id="${i}" style="background:var(--teal);color:#fff">Set</button>`;
      h += `</div>`;
      h += `<a href="https://openalex.org/authors?filter=display_name.search:${encodeURIComponent(a.first + ' ' + a.last)}" target="_blank" style="font-size:11px;color:var(--teal);margin-top:4px;display:inline-block">🔗 Search on openalex.org →</a>`;
      h += `</div>`;
      h += `</div>`;
    }
  });
  h += `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px">`;
  h += `<input type="text" id="new-auth-last" placeholder="Last name *">`;
  h += `<input type="text" id="new-auth-first" placeholder="First name">`;
  h += `<input type="text" id="new-auth-middle" placeholder="Middle (optional)">`;
  h += `<input type="text" id="new-auth-aff" placeholder="Affiliation">`;
  h += `<input type="text" id="new-auth-note" placeholder="Research note">`;
  h += `<input type="text" id="new-auth-orcid" placeholder="ORCID (0000-...)" style="font-size:11px">`;
  h += `</div>`;
  h += `<button class="btn btn-sm mt-3" id="btn-add-author" style="background:var(--purple);color:#fff;width:100%">Add Author</button>`;
  h += `</div></div>`;

  // Save
  h += `<div class="flex gap-2 mt-3">`;
  h += `<button class="btn btn-primary flex-1" id="btn-save-config" onclick="saveCurrentProfile()">💾 Save Profile</button>`;
  if (state.profiles.length > 1 && !state.isDraft) h += `<button class="btn btn-danger" id="btn-delete-profile" onclick="deleteCurrentProfile()">Delete</button>`;
  h += `</div>`;
  h += `<div class="flex gap-2 mt-3" style="flex-wrap:wrap;align-items:center">`;
  h += `<button class="btn btn-secondary btn-sm" id="btn-export-profile" title="Download this profile as a JSON file to share with lab mates">⤓ Export profile</button>`;
  h += `<label class="btn btn-secondary btn-sm" style="cursor:pointer" title="Load a profile JSON exported by someone else">⤒ Import profile<input type="file" id="import-profile" accept=".json,application/json" hidden></label>`;
  h += `<span class="hint" style="margin:0">Share profiles with lab mates — API keys are never included.</span>`;
  h += `</div></div>`;
  return h;
}

// ============================================================
// EVENT BINDING
// ============================================================
function bindEvents() {
  // Use property assignment (not addEventListener) to prevent stacking on re-render
  const c = $("content");
  c.onclick = handleClick;
  c.oninput = handleInput;
  c.onkeydown = handleKeydown;
  c.onchange = handleChange;
}

// Add a keyword to a tier (trimmed, no case-insensitive duplicates) and auto-save
function addKeyword(tierKey, raw) {
  const kw = String(raw || "").trim();
  const tier = state.profile.tiers[tierKey];
  if (!kw || !tier) return false;
  if (tier.keywords.some(k => k.toLowerCase() === kw.toLowerCase())) {
    state.message = { type: "warn", text: `"${kw}" is already in ${tier.label}.` };
  } else {
    tier.keywords.push(kw);
    saveProfile();
  }
  return true;
}

function toggleMark(kind, key) {
  const m = state.marks[kind];
  if (m[key]) delete m[key];
  else if (kind === "starred") {
    const p = findPaper(key);
    if (!p) return;
    // Store a compact copy so the reading list survives future searches
    const { _openalexAuthorIds, ...rest } = p;
    m[key] = { ...rest, _starredAt: Date.now() };
  } else m[key] = Date.now();
  saveMarks();
  render();
}

function handleClick(e) {
  const t = e.target;
  if (t.id === "btn-search") runSearch();
  if (t.id === "btn-copy" || t.id === "btn-copy-digest") { const v = visiblePapers(); if (v.length) copyText(generateDigest(v, state.profile), `Digest of ${v.length} papers copied to clipboard.`); }
  if (t.id === "btn-bibtex") { const v = visiblePapers(); if (v.length) copyText(toBibtex(v), `BibTeX for ${v.length} papers copied — in Zotero use File → Import from Clipboard.`); }
  if (t.id === "btn-toggle-sort") { state.sortBy = state.sortBy === "score" ? "date" : "score"; try { localStorage.setItem("lm-sort", state.sortBy); } catch {} render(); }
  if (t.id === "btn-email-now" || t.id === "btn-email-send") { saveProfile(); emailDigest(); }
  if (t.closest("[data-list-mode]")) { state.listMode = t.closest("[data-list-mode]").dataset.listMode; render(); }
  if (t.dataset.star) toggleMark("starred", t.dataset.star);
  if (t.dataset.hide) toggleMark("hidden", t.dataset.hide);
  if (t.id === "btn-export-profile") {
    const p = state.profile;
    const blob = new Blob([JSON.stringify({ litMonitorProfile: 1, ...p, emailRecipients: "" }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `${(p.name || "profile").replace(/[^\w.-]+/g, "_")}.lit-monitor.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  // Note: btn-save-config and btn-delete-profile now use inline onclick → saveCurrentProfile()/deleteCurrentProfile()
  if (t.id === "btn-add-author") {
    const last = $("new-auth-last")?.value?.trim();
    if (!last) return;
    const orcidRaw = ($("new-auth-orcid")?.value || "").trim();
    const orcidMatch = orcidRaw.match(/(\d{4}-\d{4}-\d{4}-\d{3}[\dX])/);
    const newAuthor = {
      last,
      first: $("new-auth-first")?.value || "",
      middle: $("new-auth-middle")?.value || "",
      aff: $("new-auth-aff")?.value || "",
      note: $("new-auth-note")?.value || ""
    };
    if (orcidMatch) {
      newAuthor.orcid = `https://orcid.org/${orcidMatch[1]}`;
      state.profile.authors.push(newAuthor);
      saveProfile();
      const idx = state.profile.authors.length - 1;
      state.message = { type: "info", text: `Resolving ORCID ${orcidMatch[1]}…` };
      render();
      fetch(`https://api.openalex.org/authors/orcid:${orcidMatch[1]}?${oaAuth()}`)
        .then(r => r.ok ? r.json() : Promise.reject("Not found"))
        .then(data => {
          if (data.id) {
            state.profile.authors[idx].openalexId = data.id;
            state.message = { type: "success", text: `✓ Added ${data.display_name} — ORCID resolved to ${data.id}` };
          } else {
            state.message = { type: "warn", text: `Added ${last}, but ORCID didn't resolve to an OpenAlex ID.` };
          }
          saveProfile(); render();
        })
        .catch(() => {
          state.message = { type: "warn", text: `Added ${last}, but ORCID ${orcidMatch[1]} not found in OpenAlex.` };
          render();
        });
    } else {
      state.profile.authors.push(newAuthor);
      saveProfile();
      state.message = { type: "info", text: `Added ${newAuthor.first} ${last}. Click 🔍 Find ID next to the name for exact matching.` };
      render();
    }
  }
  // Accept a suggested keyword
  if (t.dataset.acceptKw) {
    const [tierKey, kw] = t.dataset.acceptKw.split(":::");
    if (addKeyword(tierKey, kw)) render();
  }
  // Dismiss suggestions
  if (t.id === "btn-dismiss-suggestions") {
    state.kwSuggestions = null;
    render();
  }
  // AI Verify author via Gemini
  if (t.dataset.aiVerify != null) {
    const idx = parseInt(t.dataset.aiVerify);
    const a = state.profile.authors[idx];
    if (!a || !state.geminiKey) return;
    state.idLookup = { authorIdx: idx, loading: true, candidates: null, customQuery: '' };
    state.message = { type: "info", text: `Gemini is searching for ${a.first} ${a.last}…` };
    render();
    geminiVerifyAuthor(`${a.first} ${a.last}`, a.aff, a.note, state.geminiKey).then(result => {
      if (result?.openalexId && result.confidence !== "low") {
        state.profile.authors[idx].openalexId = result.openalexId;
        if (result.orcid) state.profile.authors[idx].orcid = result.orcid;
        saveProfile();
        state.idLookup = null;
        state.message = { type: "success", text: `✓ Found ${result.name || a.last} at ${result.institution || "?"} (confidence: ${result.confidence})` };
      } else {
        state.message = { type: "warn", text: result?.note || `Could not confidently identify ${a.first} ${a.last}. Try pasting their OpenAlex URL or ORCID manually.` };
      }
      render();
    }).catch(err => {
      state.message = { type: "warn", text: "Gemini verify error: " + err.message };
      state.idLookup = null;
      render();
    });
  }
  // Manual ID paste (OpenAlex URL/ID or ORCID)
  if (t.dataset.setManualId != null) {
    const idx = parseInt(t.dataset.setManualId);
    const input = document.querySelector(`.manual-id-input[data-manual-idx="${idx}"]`);
    const raw = (input?.value || "").trim();
    if (!raw) return;

    // Detect format
    const orcidMatch = raw.match(/(\d{4}-\d{4}-\d{4}-\d{3}[\dX])/);
    const oaMatch = raw.match(/(A\d{5,})/i);
    const oaUrlMatch = raw.match(/openalex\.org\/(A\d+)/i);

    if (oaUrlMatch || oaMatch) {
      const id = oaUrlMatch ? `https://openalex.org/${oaUrlMatch[1]}` : `https://openalex.org/${oaMatch[1]}`;
      state.profile.authors[idx].openalexId = id;
      saveProfile();
      state.idLookup = null;
      state.message = { type: "success", text: `✓ OpenAlex ID set: ${id}` };
      render();
    } else if (orcidMatch) {
      // Resolve ORCID → OpenAlex ID
      state.message = { type: "info", text: `Resolving ORCID ${orcidMatch[1]}…` };
      render();
      fetch(`https://api.openalex.org/authors/orcid:${orcidMatch[1]}?${oaAuth()}`)
        .then(r => r.ok ? r.json() : Promise.reject("Not found"))
        .then(data => {
          if (data.id) {
            state.profile.authors[idx].openalexId = data.id;
            state.profile.authors[idx].orcid = `https://orcid.org/${orcidMatch[1]}`;
            saveProfile();
            state.idLookup = null;
            state.message = { type: "success", text: `✓ ORCID resolved → ${data.display_name} (${data.id})` };
          } else {
            state.message = { type: "warn", text: "ORCID found but no OpenAlex ID linked." };
          }
          render();
        })
        .catch(() => {
          state.message = { type: "warn", text: `Could not resolve ORCID ${orcidMatch[1]}. Check it's correct.` };
          render();
        });
    } else {
      state.message = { type: "warn", text: "Unrecognized format. Paste an OpenAlex URL (openalex.org/A...), ID (A1234...), or ORCID (0000-0002-...)." };
      render();
    }
  }

  // Remove keyword
  if (t.classList.contains("kw-remove") && t.dataset.tier != null) {
    state.profile.tiers[t.dataset.tier].keywords.splice(parseInt(t.dataset.idx), 1);
    saveProfile();
    render();
  }
  // Remove author
  if (t.classList.contains("kw-remove") && t.dataset.rmAuthor != null) {
    state.profile.authors.splice(parseInt(t.dataset.rmAuthor), 1);
    state.idLookup = null;  // indices shift — close any open lookup
    saveProfile();
    render();
  }
  // Bulk auto-resolve OpenAlex IDs
  if (t.id === "btn-bulk-find-ids") {
    const targets = state.profile.authors.map((a, i) => ({ a, i })).filter(x => !x.a.openalexId);
    if (!targets.length) { state.message = { type:"success", text:"All authors already have IDs." }; render(); return; }
    if (!confirm(`Look up OpenAlex IDs for ${targets.length} authors? This will use the best match for each based on name + affiliation. You can verify/change them afterwards.`)) return;
    state.message = { type:"info", text: `Resolving ${targets.length} author IDs… this takes ~1s per author.` };
    render();
    (async () => {
      let resolved = 0;
      let processed = 0;
      for (const { a, i } of targets) {
        const candidates = await lookupAuthorId(`${a.first} ${a.last}`, a.aff);
        if (candidates.length > 0) {
          // Candidates come back ranked: affiliation match first, then by number of works.
          // Require the candidate's surname to match, so we never link a different person.
          const best = candidates.find(c => foldAccents(c.name).toLowerCase().includes(foldAccents(a.last).toLowerCase()));
          if (!best) { processed++; continue; }
          state.profile.authors[i].openalexId = best.id;
          if (best.orcid && best.orcid.includes("orcid.org")) state.profile.authors[i].orcid = best.orcid;
          resolved++;
        }
        processed++;
        // Live update: save and re-render after each author so user sees progress
        saveProfile();
        state.message = { type:"info", text: `Resolving authors… ${processed}/${targets.length} processed, ${resolved} matched` };
        render();
        await new Promise(r => setTimeout(r, 250));
      }
      state.message = { type:"success", text: `Resolved ${resolved} of ${targets.length} author IDs. Click 🔍 Find ID next to any that look wrong to change manually.` };
      render();
    })();
  }
  // Find OpenAlex ID for a single author
  if (t.classList.contains("btn-find-id") || t.dataset.findId != null) {
    const idx = parseInt(t.dataset.findId);
    if (!isNaN(idx)) {
      const a = state.profile.authors[idx];
      state.idLookup = { authorIdx: idx, loading: true, candidates: null, customQuery: '' };
      render();
      lookupAuthorId(`${a.first} ${a.last}`, a.aff).then(candidates => {
        state.idLookup = { authorIdx: idx, loading: false, candidates, customQuery: '' };
        render();
      });
    }
  }
  // Pick a candidate
  if (t.dataset.pickId || t.closest("[data-pick-id]")) {
    const elem = t.dataset.pickId ? t : t.closest("[data-pick-id]");
    const [authorIdx, candIdx] = elem.dataset.pickId.split("|").map(Number);
    const cand = state.idLookup.candidates[candIdx];
    state.profile.authors[authorIdx].openalexId = cand.id;
    if (cand.orcid && cand.orcid.includes("orcid.org")) {
      state.profile.authors[authorIdx].orcid = cand.orcid;
    }
    saveProfile();
    state.idLookup = null;
    state.message = { type: "success", text: `Linked ${cand.name} (${cand.hint || cand.shortId})` };
    render();
  }
  // Cancel lookup
  if (t.dataset.cancelLookup) {
    state.idLookup = null;
    render();
  }
  // Retry lookup with custom query
  if (t.dataset.lookupRetry != null) {
    const idx = parseInt(t.dataset.lookupRetry);
    const searchInput = document.querySelector('.lookup-search');
    const customQuery = searchInput?.value?.trim();
    const a = state.profile.authors[idx];
    const query = customQuery || `${a.first} ${a.last}`;
    state.idLookup = { authorIdx: idx, loading: true, candidates: null, customQuery: customQuery || '' };
    render();
    lookupAuthorId(query, a.aff).then(candidates => {
      state.idLookup = { authorIdx: idx, loading: false, candidates, customQuery: customQuery || '' };
      render();
    });
  }
  // Add keyword button
  if (t.dataset.addTier) {
    const inp = document.querySelector(`.kw-input[data-tier="${t.dataset.addTier}"]`);
    if (addKeyword(t.dataset.addTier, inp?.value)) render();
  }
  // Toggle abstract
  if (t.classList.contains("toggle-abstract")) {
    const abs = t.previousElementSibling;
    const full = abs.dataset.full === "1";
    abs.style.maxHeight = full ? "62px" : "none";
    abs.dataset.full = full ? "0" : "1";
    t.textContent = full ? "Show more" : "Show less";
  }
  // Review button
  if (t.classList.contains("btn-review") || t.closest(".btn-review")) {
    const btn = t.classList.contains("btn-review") ? t : t.closest(".btn-review");
    if (btn.dataset.reviewKey) openReview(btn.dataset.reviewKey);
  }
  // Search mode radio
  const modeLabel = t.closest("label");
  const radio = t.name === "searchmode" ? t : modeLabel?.querySelector('input[name="searchmode"]');
  if (radio && radio.value !== state.searchMode) {
    state.searchMode = radio.value;
    try { localStorage.setItem("lm-searchmode", state.searchMode); } catch {}
    render();
  }
}

function handleInput(e) {
  const t = e.target;
  if (!t || !t.id) return;
  // Sync form fields → state on every keystroke so re-renders preserve typed values
  const num = (v, fallback) => { const n = parseInt(v); return Number.isFinite(n) && n >= 0 ? n : fallback; };
  switch (t.id) {
    case "cfg-name":       state.nameInput = t.value; return;  // applied on Save (renames move stored data)
    case "cfg-desc":       state.profile.description = t.value; break;
    case "cfg-days":       state.profile.lookbackDays = Math.min(90, Math.max(1, num(t.value, 7))); break;
    case "cfg-minscore":   state.profile.minScore = num(t.value, 0); break;
    case "cfg-authscore":  state.profile.authorScore = num(t.value, 8); break;
    case "cfg-extraterms": state.profile.extraSearchTerms = t.value; break;
    case "cfg-biorxiv":    state.profile.biorxivCategories = t.value; break;
    case "cfg-apikey":     state.apiKey = t.value.trim(); try { localStorage.setItem("lm-apikey", state.apiKey); } catch {} return;
    case "cfg-geminikey":  state.geminiKey = t.value.trim(); try { localStorage.setItem("lm-geminikey", state.geminiKey); } catch {} return;
    case "cfg-openalexkey": state.openalexKey = t.value.trim(); try { localStorage.setItem("lm-openalexkey", state.openalexKey); } catch {} return;
    case "cfg-geminimodel": state.geminiModel = t.value.trim(); try { localStorage.setItem("lm-geminimodel", state.geminiModel); } catch {} return;
    case "cfg-email-recipients": state.profile.emailRecipients = t.value; break;
    case "filter-input":   state.filterText = t.value; render(); return;
    default: return;
  }
  // Settings auto-save (drafts are only saved via the Save button)
  saveProfile();
}

// Import a profile JSON exported by a lab mate
function handleChange(e) {
  const t = e.target;
  if (t.id !== "import-profile" || !t.files?.[0]) return;
  const file = t.files[0];
  file.text().then(txt => {
    const data = JSON.parse(txt);
    if (!data || typeof data !== "object" || !data.tiers || !data.name) throw new Error("not a Literature Monitor profile");
    delete data.litMonitorProfile;
    let name = String(data.name).trim(), n = 2;
    while (state.profiles.includes(name)) name = `${data.name} (${n++})`;
    const prof = upgradeProfile({ ...JSON.parse(JSON.stringify(DEFAULT_PROFILE)), ...data, name, emailRecipients: "" });
    state.isDraft = false;
    state.profile = prof;
    state.activeProfile = name;
    saveProfile(prof);
    switchProfile(name);
    state.view = "config";
    state.message = { type: "success", text: `Imported profile "${name}".` };
    render();
  }).catch(err => {
    state.message = { type: "warn", text: `Could not import ${file.name}: ${err.message}` };
    render();
  });
}

function handleKeydown(e) {
  if (e.key === "Enter" && e.target.classList.contains("kw-input")) {
    if (addKeyword(e.target.dataset.tier, e.target.value)) render();
  }
  if (e.key === "Enter" && e.target.classList.contains("lookup-search")) {
    const idx = parseInt(e.target.dataset.lookupIdx);
    const query = e.target.value.trim();
    if (!isNaN(idx)) {
      const a = state.profile.authors[idx];
      state.idLookup = { authorIdx: idx, loading: true, candidates: null, customQuery: query };
      render();
      lookupAuthorId(query || `${a.first} ${a.last}`, a.aff).then(candidates => {
        state.idLookup = { authorIdx: idx, loading: false, candidates, customQuery: query };
        render();
      });
    }
  }
}

// Tab clicks
$("tabs").addEventListener("click", e => {
  if (e.target.dataset.tab) { state.view = e.target.dataset.tab; state.message = null; render(); }
  // Note: + New Profile button uses inline onclick="createNewProfile()" for robustness
});

// Profile switch
$("profile-select").addEventListener("change", e => {
  const name = e.target.value;
  if (!name) return;  // Selected the "Unsaved Draft" placeholder — do nothing
  // Warn if user has an unsaved draft
  if (state.isDraft) {
    if (!confirm("You have an unsaved new profile draft. Switching will discard it. Continue?")) {
      // Restore the dropdown to its previous value (empty since draft has no name)
      e.target.value = state.activeProfile || "";
      return;
    }
  }
  switchProfile(name);
  render();
});

// Load a stored profile (and its results / reading list) as the active one
function switchProfile(name) {
  state.activeProfile = name;
  state.profile = upgradeProfile(lsGet("lm-p:" + name, null)) || upgradeProfile(JSON.parse(JSON.stringify({ ...DEFAULT_PROFILE, name })));
  const r = lsGet("lm-r:" + name, null);
  state.results = r?.papers || null;
  state.searchDate = r?.date || null;
  state.marks = loadMarks(name);
  state.isDraft = false;
  state.nameInput = null;
  state.message = null;
  state.pipelineInfo = null;
  state.kwSuggestions = null;
  state.idLookup = null;
  state.filterText = "";
  state.listMode = "all";
  try { localStorage.setItem("lm-active", name); } catch {}
}

// ============================================================
// GLOBAL FUNCTIONS (called via inline onclick — most robust pattern)
// ============================================================

// AI Suggest Keywords — called from inline onclick
window.aiSuggestKeywords = async function() {
  console.log("[AI Suggest] Button clicked. geminiKey set:", !!state.geminiKey);

  // Read latest value from input field (in case user hasn't saved yet)
  const keyInput = document.getElementById("cfg-geminikey");
  const currentKey = (keyInput?.value || state.geminiKey || "").trim();

  if (!currentKey) {
    state.message = { type: "warn", text: "⚠️ Enter a Gemini API key in the field below first." };
    render();
    return;
  }

  // Sync state with the input value
  state.geminiKey = currentKey;
  localStorage.setItem("lm-geminikey", currentKey);

  state.kwSuggestions = null;
  state.message = { type: "info", text: "🤖 Gemini is analyzing your description and searching for relevant terminology…" };
  state.view = "config";
  render();

  try {
    console.log("[AI Suggest] Calling Gemini API…");
    const suggestions = await geminiSuggestKeywords(state.profile, currentKey);
    console.log("[AI Suggest] Response received:", suggestions);

    if (suggestions && Object.keys(suggestions).length > 0) {
      state.kwSuggestions = suggestions;
      state.message = { type: "success", text: "✨ Suggestions ready! Click any keyword tag to add it." };
    } else {
      state.message = { type: "warn", text: "Gemini returned no usable suggestions. Try writing a more detailed description." };
    }
  } catch(err) {
    console.error("[AI Suggest] Error:", err);
    state.message = { type: "warn", text: `Gemini error: ${err.message || err}. Check the browser console (F12) for details.` };
  }
  state.view = "config";
  render();
};

// Create New Profile — called from inline onclick on the tab button
// Critical: creates draft in MEMORY only, doesn't save until user clicks Save
window.createNewProfile = function() {
  console.log("[New Profile] Creating draft");

  state.profile = {
    name: "",  // Empty — user must enter one
    description: "",
    lookbackDays: 7,
    minScore: 2,
    authorScore: 8,
    tiers: {
      tier1: { label: "Core Technique", score: 10, color: "#4a7c59", keywords: [] },
      tier2: { label: "Adjacent Methods", score: 6, color: "#1e40af", keywords: [] },
      tier3: { label: "Broader Field", score: 3, color: "#b08d57", keywords: [] }
    },
    authors: [],
    biorxivCategories: "",
    extraSearchTerms: "",
    emailRecipients: ""
  };
  state.activeProfile = null;       // No active profile — it's a draft
  state.nameInput = "";
  state.marks = { seen: {}, starred: {}, hidden: {} };
  state.listMode = "all";
  state.filterText = "";
  state.isDraft = true;             // Flag for UI to show draft warning
  state.results = null;
  state.searchDate = null;
  state.kwSuggestions = null;
  state.idLookup = null;
  state.message = { type: "info", text: "📝 New profile draft. Enter a name and click Save Profile when ready." };
  state.view = "config";
  render();
};

// Save Current Profile — called from inline onclick on the Save button
window.saveCurrentProfile = function() {
  console.log("[Save] Saving profile. isDraft:", state.isDraft);

  const newName = (document.getElementById("cfg-name")?.value || "").trim();
  if (!newName) {
    state.message = { type: "warn", text: "⚠️ Please enter a profile name before saving." };
    render();
    return;
  }

  const wasDraft = state.isDraft === true;
  const oldName = state.activeProfile;

  // Name conflicts with another existing profile (new or renamed)
  if (newName !== oldName && state.profiles.includes(newName)) {
    state.message = { type: "warn", text: `⚠️ A profile named "${newName}" already exists. Choose a different name.` };
    render();
    return;
  }

  // For renames: move stored results / reading list to the new name, keep list order
  if (!wasDraft && oldName && oldName !== newName) {
    for (const prefix of ["lm-r:", "lm-m:"]) {
      const v = localStorage.getItem(prefix + oldName);
      if (v != null) { try { localStorage.setItem(prefix + newName, v); } catch {} }
      localStorage.removeItem(prefix + oldName);
    }
    localStorage.removeItem("lm-p:" + oldName);
    state.profiles = state.profiles.map(n => n === oldName ? newName : n);
  }

  // Update profile from form fields
  state.profile.name = newName;
  state.profile.description = document.getElementById("cfg-desc")?.value || "";
  const num = (id, fallback) => { const n = parseInt(document.getElementById(id)?.value); return Number.isFinite(n) && n >= 0 ? n : fallback; };
  state.profile.lookbackDays = Math.min(90, Math.max(1, num("cfg-days", 7)));
  state.profile.minScore = num("cfg-minscore", 2);     // 0 is a valid choice (was silently reset to 2)
  state.profile.authorScore = num("cfg-authscore", 8);

  state.activeProfile = newName;
  state.isDraft = false;
  state.nameInput = null;

  // Save API keys
  const geminiKeyInput = document.getElementById("cfg-geminikey");
  if (geminiKeyInput) state.geminiKey = geminiKeyInput.value || "";
  const apiKeyInput = document.getElementById("cfg-apikey");
  if (apiKeyInput) state.apiKey = apiKeyInput.value || "";
  localStorage.setItem("lm-apikey", state.apiKey);
  localStorage.setItem("lm-geminikey", state.geminiKey);

  // Persist profile (adds to state.profiles if not present, saves to localStorage)
  saveProfile();
  saveMarks();

  state.message = { type: "success", text: `✓ Profile "${newName}" saved!` };
  state.view = "results";
  render();
};

// Delete Current Profile — called from inline onclick
window.deleteCurrentProfile = function() {
  if (state.profiles.length <= 1) {
    state.message = { type: "warn", text: "Can't delete the only profile." };
    render();
    return;
  }
  if (!confirm(`Delete profile "${state.activeProfile}"? This cannot be undone.`)) return;

  console.log("[Delete] Removing profile:", state.activeProfile);
  const toDelete = state.activeProfile;
  state.profiles = state.profiles.filter(n => n !== toDelete);
  localStorage.removeItem("lm-p:" + toDelete);
  localStorage.removeItem("lm-r:" + toDelete);
  localStorage.setItem("lm-profiles", JSON.stringify(state.profiles));

  localStorage.removeItem("lm-m:" + toDelete);

  // Switch to the first remaining profile (with its saved results)
  switchProfile(state.profiles[0]);
  state.message = { type: "success", text: `Deleted "${toDelete}".` };
  state.view = "results";
  render();
};

document.getElementById("review-close").addEventListener("click", closeReview);
document.getElementById("review-overlay").addEventListener("click", closeReview);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeReview(); });
loadState();
render();
