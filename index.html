<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Literature Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600;6..72,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* Crick/London neuroscience palette */
  --navy: #0a1929;        /* Deep midnight — Crick building cladding */
  --navy-soft: #1e3a5f;
  --teal: #134e4a;        /* Deep teal — scientific gravitas */
  --gold: #b08d57;        /* Crick gold — interior accents */
  --gold-bright: #d4a574;
  --sage: #4a7c59;        /* Muted GFP green */
  --sage-bright: #5d9b6b;
  --rose: #b15968;        /* Subtle dendrite pink */
  --blue: #1e40af; --green: #4a7c59; --amber: #b08d57; --purple: #6b4c93; --red: #991b1b;
  --bg: #faf7f0;          /* Warm cream paper */
  --bg-alt: #f3efe5; --card: #ffffff;
  --text: #0a1929; --muted: #64748b;
  --border: #e8e4d6; --border-strong: #d8d3c3;
  --font-head: 'Newsreader', 'Charter', Georgia, serif;
  --font-mono: 'DM Mono', 'Fira Code', monospace;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 14px; line-height: 1.6; }
::selection { background: rgba(176, 141, 87, 0.25); }
.container { max-width: 820px; margin: 0 auto; padding: 0 20px 60px; }

/* Header — Crick-inspired with subtle neuron decoration */
.header {
  background: linear-gradient(135deg, var(--navy) 0%, #0d2238 40%, var(--teal) 100%);
  padding: 32px 20px 0; color: #fff;
  position: relative; overflow: hidden;
  border-bottom: 3px solid var(--gold);
}
.header-inner { max-width: 820px; margin: 0 auto; position: relative; z-index: 1; }
.header h1 {
  font-family: var(--font-head); font-size: 28px; font-weight: 600;
  letter-spacing: -0.02em; line-height: 1.1;
}
.header h1::after {
  content: ""; display: block; width: 36px; height: 2px;
  background: var(--gold-bright); margin-top: 8px;
}
.header-sub { opacity: 0.65; font-size: 12px; margin-top: 10px; font-family: var(--font-mono); letter-spacing: 0.02em; }
.tabs { display: flex; gap: 2px; margin-top: 20px; }
.tab {
  padding: 10px 20px; border-radius: 8px 8px 0 0; border: none; cursor: pointer;
  font-size: 12px; font-weight: 500; font-family: var(--font-mono);
  background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.55);
  transition: all 0.2s; letter-spacing: 0.02em;
}
.tab.active { background: var(--bg); color: var(--navy); box-shadow: 0 -2px 8px rgba(0,0,0,0.04); }
.tab:hover:not(.active) { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.85); }

/* Cards — refined paper aesthetic */
.card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(10,25,41,0.03); }
.paper-card {
  border-left: 3px solid var(--border-strong);
  padding: 16px 20px; margin-bottom: 10px; background: var(--card);
  border-radius: 0 6px 6px 0; box-shadow: 0 1px 2px rgba(10,25,41,0.04);
  transition: all 0.2s ease;
}
.paper-card:hover { box-shadow: 0 4px 12px rgba(10,25,41,0.08); transform: translateY(-1px); }
.paper-card.high { border-left-color: var(--sage-bright); border-left-width: 4px; }
.paper-card.med { border-left-color: var(--blue); }
.paper-card.low { border-left-color: var(--border-strong); }
.paper-title { font-family: var(--font-head); font-size: 16px; font-weight: 600; color: var(--navy); text-decoration: none; line-height: 1.35; display: block; letter-spacing: -0.005em; }
.paper-title:hover { color: var(--teal); text-decoration: underline; text-decoration-color: var(--gold); }
.paper-authors { font-size: 12.5px; color: #475569; margin-top: 5px; font-style: italic; }
.paper-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; font-size: 11px; color: #94a3b8; }
.badge { padding: 2px 9px; border-radius: 10px; font-weight: 500; font-size: 11px; font-family: var(--font-mono); }
.badge-source { background: rgba(19,78,74,0.08); color: var(--teal); }
.badge-score-high { background: rgba(74,124,89,0.12); color: var(--sage); font-weight: 500; }
.badge-score-med { background: rgba(30,64,175,0.08); color: var(--blue); font-weight: 500; }
.badge-score-low { background: rgba(100,116,139,0.08); color: var(--muted); font-weight: 500; }
.tag { font-size: 10.5px; padding: 2px 8px; border-radius: 10px; display: inline-block; margin: 2px; font-family: var(--font-mono); letter-spacing: 0.01em; }
.paper-abstract { font-size: 13.5px; color: #334155; line-height: 1.55; margin-top: 10px; overflow: hidden; }
.toggle-abstract { background: none; border: none; color: var(--teal); font-size: 12px; cursor: pointer; padding: 6px 0; font-weight: 500; }
.toggle-abstract:hover { color: var(--gold); }

/* Buttons */
.btn { padding: 10px 22px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; font-family: var(--font-body); transition: all 0.18s ease; display: inline-flex; align-items: center; gap: 6px; letter-spacing: 0.01em; }
.btn-primary { background: linear-gradient(135deg, var(--teal), var(--navy)); color: #fff; box-shadow: 0 2px 6px rgba(19,78,74,0.25); }
.btn-primary:hover { box-shadow: 0 4px 14px rgba(19,78,74,0.35); transform: translateY(-1px); }
.btn-primary:disabled { background: #94a3b8; box-shadow: none; cursor: wait; transform: none; }
.btn-secondary { background: var(--card); color: var(--navy); border: 1px solid var(--border-strong); }
.btn-secondary:hover { background: var(--bg-alt); border-color: var(--gold); }
.btn-danger { background: var(--card); color: var(--red); border: 1px solid #fecaca; }
.btn-sm { padding: 6px 14px; font-size: 12px; }

/* Section headers */
.section-head { font-size: 12px; font-weight: 500; font-family: var(--font-mono); letter-spacing: 0.06em; padding-bottom: 6px; margin: 28px 0 12px; border-bottom: 1px solid; }

/* Config */
.config-section { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(10,25,41,0.03); }
.config-header { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.config-body { padding: 16px 20px 20px; }
.kw-tag { font-size: 12px; font-family: var(--font-body); padding: 4px 10px; border-radius: 14px; display: inline-flex; align-items: center; gap: 6px; margin: 3px; }
.kw-remove { background: none; border: none; cursor: pointer; font-size: 14px; padding: 0; line-height: 1; opacity: 0.6; }
.kw-remove:hover { opacity: 1; }
input[type="text"], input[type="number"], input[type="email"], input[type="password"] {
  padding: 9px 12px; border-radius: 6px; border: 1px solid var(--border-strong); font-size: 13.5px;
  width: 100%; outline: none; font-family: var(--font-body); background: var(--card);
  transition: all 0.15s; color: var(--text);
}
input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(19,78,74,0.08); }
.author-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--bg-alt); font-size: 13px; }
.author-row:last-child { border-bottom: none; }

/* Progress */
.progress-bar { background: var(--border); border-radius: 4px; height: 6px; overflow: hidden; margin-top: 14px; }
.progress-fill { background: linear-gradient(90deg, var(--teal), var(--gold)); height: 100%; border-radius: 4px; transition: width 0.5s ease; }
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--teal); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 14px; }

/* Alerts */
.alert { padding: 12px 16px; border-radius: 8px; font-size: 13px; margin: 16px 0; font-family: var(--font-mono); }
.alert-warn { background: rgba(176,141,87,0.1); border: 1px solid rgba(176,141,87,0.4); color: #78521f; }
.alert-success { background: rgba(74,124,89,0.08); border: 1px solid rgba(74,124,89,0.3); color: var(--sage); }
.alert-info { background: rgba(19,78,74,0.05); border: 1px solid rgba(19,78,74,0.2); color: var(--teal); }
.flex { display: flex; } .gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .flex-1 { flex: 1; }
.mt-3 { margin-top: 12px; } .mt-4 { margin-top: 16px; } .mb-4 { margin-bottom: 16px; }
.text-center { text-align: center; }

/* Email config */
.email-section { background: linear-gradient(135deg, rgba(176,141,87,0.08), rgba(176,141,87,0.03)); border: 1px solid rgba(176,141,87,0.3); border-radius: 10px; padding: 22px; margin-top: 20px; }
.email-section h3 { font-family: var(--font-head); font-size: 17px; margin-bottom: 8px; color: var(--navy); }
.code-block { background: var(--navy); color: #e2e8f0; padding: 14px 18px; border-radius: 8px; font-family: var(--font-mono); font-size: 12px; overflow-x: auto; margin: 8px 0; white-space: pre; line-height: 1.65; border: 1px solid var(--gold); }

/* Review panel */
.review-overlay { position: fixed; inset: 0; background: rgba(10,25,41,0.55); z-index: 100; backdrop-filter: blur(4px); opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.review-overlay.open { opacity: 1; pointer-events: all; }
.review-panel { position: fixed; top: 0; right: 0; width: min(680px, 92vw); height: 100vh; background: var(--bg); z-index: 101; box-shadow: -4px 0 30px rgba(10,25,41,0.2); transform: translateX(100%); transition: transform 0.35s cubic-bezier(0.4,0,0.2,1); overflow-y: auto; }
.review-panel.open { transform: translateX(0); }
.review-panel-header { position: sticky; top: 0; background: linear-gradient(135deg, var(--navy), var(--teal)); color: #fff; padding: 22px 24px; z-index: 1; border-bottom: 2px solid var(--gold); }
.review-panel-body { padding: 24px; }
.review-panel-body h2 { font-family: var(--font-head); font-size: 18px; color: var(--navy); margin: 26px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border-strong); }
.review-panel-body h2:first-child { margin-top: 0; }
.review-panel-body p, .review-panel-body li { font-size: 14px; line-height: 1.65; color: var(--text); }
.review-panel-body ul, .review-panel-body ol { padding-left: 22px; margin: 8px 0; }
.review-panel-body li { margin-bottom: 6px; }
.review-panel-body strong { color: var(--navy); }
.confidence-tag { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 11px; font-weight: 600; font-family: var(--font-mono); }
.confidence-high { background: rgba(74,124,89,0.12); color: var(--sage); }
.confidence-med { background: rgba(176,141,87,0.15); color: #78521f; }
.confidence-low { background: rgba(153,27,27,0.08); color: var(--red); }
.review-spinner { width: 28px; height: 28px; border: 3px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; vertical-align: middle; margin-right: 10px; }
.btn-review { background: none; border: 1px solid var(--border-strong); border-radius: 6px; padding: 4px 10px; font-size: 11px; font-family: var(--font-mono); color: var(--muted); cursor: pointer; transition: all 0.15s; }
.btn-review:hover { border-color: var(--teal); color: var(--teal); background: rgba(19,78,74,0.05); }
.lookup-candidate:hover { border-color: var(--teal) !important; background: rgba(19,78,74,0.05) !important; transform: translateX(2px); }
.btn-find-id:hover { background: rgba(176,141,87,0.2) !important; }
.paper-head { display: flex; gap: 10px; align-items: flex-start; }
.paper-head .paper-title { flex: 1; min-width: 0; }
.paper-actions { display: flex; gap: 4px; flex-shrink: 0; }
.icon-btn { background: none; border: 1px solid transparent; border-radius: 6px; width: 28px; height: 28px; cursor: pointer; color: var(--muted); font-size: 15px; line-height: 1; }
.icon-btn:hover { border-color: var(--border-strong); background: var(--bg-alt); color: var(--navy); }
.icon-btn.on { color: var(--gold); }
.badge-new { display: inline-block; background: var(--rose); color: #fff; font-family: var(--font-mono); font-size: 10px; font-weight: 500; padding: 1px 6px; border-radius: 4px; margin-right: 8px; vertical-align: 2px; letter-spacing: 0.04em; }
.list-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; background: var(--card); }
.seg-btn { border: none; background: none; padding: 7px 12px; font-family: var(--font-body); font-size: 12.5px; cursor: pointer; color: var(--muted); }
.seg-btn span { opacity: 0.7; margin-left: 2px; }
.seg-btn.active { background: var(--teal); color: #fff; }
.seg-btn:not(.active):hover { background: var(--bg-alt); color: var(--navy); }
.source-grid { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 14px; }
.source-chip { font-family: var(--font-mono); font-size: 11px; padding: 3px 10px; border-radius: 10px; background: var(--bg-alt); color: var(--muted); }
.source-chip.done { background: rgba(74,124,89,0.12); color: var(--sage); }
.source-chip.error { background: rgba(153,27,27,0.08); color: var(--red); }
.hint { font-size: 11.5px; color: var(--muted); font-weight: 400; display: block; margin-top: 2px; line-height: 1.45; }
.hint a { color: var(--teal); }
.cfg-card { display: grid; gap: 16px; }
.cfg-card > * { min-width: 0; }
.card-title { font-family: var(--font-head); font-size: 17px; font-weight: 600; color: var(--navy); letter-spacing: -0.01em; }
.card-sub { font-family: var(--font-body); font-size: 11px; font-weight: 400; color: var(--muted); margin-left: 6px; letter-spacing: 0.02em; text-transform: uppercase; }
.field { display: block; font-size: 12.5px; font-weight: 500; color: #334155; min-width: 0; }
.field > input { margin-top: 6px; }
.field > .seg { display: flex; width: fit-content; max-width: 100%; margin-top: 6px; }
.grid-2, .grid-3 { display: grid; gap: 14px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 600px) { .grid-2, .grid-3 { grid-template-columns: minmax(0, 1fr); } }
.row-inline { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn-gold { background: var(--gold); color: #fff; }
.btn-gold:hover { background: #9c7a48; }
input.mono { font-family: var(--font-mono); font-size: 12.5px; }
@media (max-width: 600px) { .container { padding: 0 14px 60px; } .header { padding: 24px 14px 0; } .tab { padding: 9px 12px; } }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="flex" style="justify-content:space-between;align-items:flex-start">
      <div>
        <h1>Literature Monitor</h1>
        <div class="header-sub" id="header-sub">Loading…</div>
      </div>
      <select id="profile-select" style="background:rgba(255,255,255,0.12);color:#fff;border:1px solid rgba(255,255,255,0.2);border-radius:6px;padding:6px 12px;font-size:12px;outline:none;cursor:pointer"></select>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="results">Results</button>
      <button class="tab" data-tab="config">Configure</button>
      <button class="tab" data-tab="email">Weekly Email</button>
      <div style="flex:1"></div>
      <button class="tab" id="btn-new-profile" onclick="createNewProfile()" style="border:1px solid rgba(255,255,255,0.2)">+ New Profile</button>
    </div>
  </div>
</div>

<div class="container" id="content"></div>

<!-- Review slide-in panel -->
<div class="review-overlay" id="review-overlay"></div>
<div class="review-panel" id="review-panel">
  <div class="review-panel-header">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div style="flex:1;min-width:0">
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;opacity:0.6;font-family:var(--font-mono)">Critical Review</div>
        <div id="review-title" style="font-family:var(--font-head);font-size:16px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
      </div>
      <button id="review-close" style="background:rgba(255,255,255,0.15);border:none;color:#fff;width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:18px;margin-left:12px;flex-shrink:0">✕</button>
    </div>
  </div>
  <div class="review-panel-body" id="review-body"></div>
</div>

<script>
// ============================================================
// DEFAULT CONFIG
// ============================================================
const DEFAULT_PROFILE = {
  name: "XNH Connectomics",
  description: "X-ray nanoholotomography for connectomics and adjacent fields",
  lookbackDays: 7, minScore: 2, authorScore: 8,

    {last:"Livingstone",first:"Jayde",aff:"ESRF",note:"XNH instrumentation"},
    {last:"Laugros",first:"Alfred",aff:"ESRF",note:"Self-supervised XNH"},
    {last:"Schroer",first:"Christian",middle:"G",aff:"DESY",note:"PETRA IV"},
    {last:"Viganò",first:"Nicola",aff:"CWI",note:"Phase retrieval"},
    {last:"Pelt",first:"Daniël",middle:"M",aff:"CWI",note:"DL for tomography"},
    {last:"Collins",first:"Logan Thrasher",aff:"WashU",note:"Imaging comparison"},
    {last:"Endrizzi",first:"Marco",aff:"UCL/Crick",note:"Phase contrast"},

    {last:"Rzepka",first:"Norman",aff:"scalable minds",note:"WEBKNOSSOS"},

// ============================================================
// STATE
// ============================================================
let state = {
  profiles: [],
  activeProfile: null,
  profile: null,
  results: null,
  searchDate: null,
  searching: false,
  progress: { current: 0, total: 0, label: "" },
  view: "results",
  apiKey: "",

  searchMode: "direct",

  sortBy: "score",  // "score" or "date"
  isDraft: false,  // True when creating a new profile that hasn't been saved yet
  idLookup: null,  // { authorIdx, loading, candidates }
  nameInput: null, // Pending profile name edit (applied on Save, so renames can't half-happen)
  marks: { seen: {}, starred: {}, hidden: {} },  // Per-profile paper tracking, keyed by paperKey()
  filterText: "",
  listMode: "all"  // "all" | "new" | "starred" | "hidden"
};

const DEFAULT_GEMINI_MODEL = "gemini-3.5-flash";
const GEMINI_FALLBACK_MODEL = "gemini-flash-latest";
const CLAUDE_MODEL = "claude-opus-5-5";
const MAILTO = "lit-monitor@research.org";

// localStorage helpers — never let a quota/privacy error break the app
function lsGet(key, fallback = null) {
  try { const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); } catch { return fallback; }
}
function lsSet(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch(e) { console.warn("localStorage write failed:", key, e); return false; }
}

// Stable identity for a paper across searches and sources
function paperKey(p) {
  if (p.doi) return "doi:" + String(p.doi).toLowerCase().replace(/^https?:\/\/(dx\.)?doi\.org\//, "").trim();
  return "t:" + (p.title || "").toLowerCase().normalize("NFKD").replace(/[^a-z0-9]/g, "").slice(0, 80);
}

function loadMarks(name) {
  const m = lsGet("lm-m:" + name, null) || {};
  return { seen: m.seen || {}, starred: m.starred || {}, hidden: m.hidden || {} };
}
function saveMarks() {
  if (state.isDraft || !state.activeProfile) return;
  lsSet("lm-m:" + state.activeProfile, state.marks);
}

// Normalise a stored profile so older saves keep working
function upgradeProfile(p) {
  if (!p) return p;
  p.tiers = p.tiers || {};
  for (const t of Object.values(p.tiers)) t.keywords = t.keywords || [];
  p.authors = p.authors || [];
  if (p.biorxivCategories == null) p.biorxivCategories = p.name === DEFAULT_PROFILE.name ? DEFAULT_PROFILE.biorxivCategories : "";
  if (p.extraSearchTerms == null) p.extraSearchTerms = p.name === DEFAULT_PROFILE.name ? DEFAULT_PROFILE.extraSearchTerms : "";
  return p;
}

function loadState() {
  try {
    const profiles = lsGet("lm-profiles", null);
    const active = localStorage.getItem("lm-active");
    if (profiles && profiles.length > 0) {
      state.profiles = profiles;
      state.activeProfile = profiles.includes(active) ? active : profiles[0];
      state.profile = upgradeProfile(lsGet("lm-p:" + state.activeProfile, null));
      // Migration: update old tier colors to new palette
      if (state.profile?.tiers) {
        const migrations = {
          "#059669": "#4a7c59",  // green → sage
          "#2563eb": "#1e40af",  // bright blue → deep blue
          "#d97706": "#b08d57"   // amber → gold
        };
        let migrated = false;
        for (const tier of Object.values(state.profile.tiers)) {
          if (migrations[tier.color]) { tier.color = migrations[tier.color]; migrated = true; }
        }
        if (migrated) lsSet("lm-p:" + state.activeProfile, state.profile);
      }
      const r = lsGet("lm-r:" + state.activeProfile, null);
      if (r) { state.results = r.papers; state.searchDate = r.date; }
    }
    if (!state.profile) {
      state.profile = upgradeProfile(JSON.parse(JSON.stringify(DEFAULT_PROFILE)));
      state.activeProfile = DEFAULT_PROFILE.name;
      state.profiles = [DEFAULT_PROFILE.name];
      saveProfile(state.profile);
    }
    state.marks = loadMarks(state.activeProfile);
    state.apiKey = localStorage.getItem("lm-apikey") || "";
    state.geminiKey = localStorage.getItem("lm-geminikey") || "";
    state.geminiModel = localStorage.getItem("lm-geminimodel") || "";
    state.openalexKey = localStorage.getItem("lm-openalexkey") || "";
    state.searchMode = localStorage.getItem("lm-searchmode") || "direct";
    state.sortBy = localStorage.getItem("lm-sort") || "score";
  } catch(e) {
    console.error("Load error:", e);
    state.profile = upgradeProfile(JSON.parse(JSON.stringify(DEFAULT_PROFILE)));
    state.activeProfile = DEFAULT_PROFILE.name;
    state.profiles = [DEFAULT_PROFILE.name];
  }
}

// Persists the active profile. Drafts are never persisted until the user saves them explicitly.
function saveProfile(p) {
  p = p || state.profile;
  if (state.isDraft || !p.name) return;
  lsSet("lm-p:" + p.name, p);
  if (!state.profiles.includes(p.name)) state.profiles.push(p.name);
  lsSet("lm-profiles", state.profiles);
  localStorage.setItem("lm-active", p.name);
}

function saveResults(papers) {
  const data = { papers, date: new Date().toISOString() };
  state.searchDate = data.date;
  if (state.isDraft) return;
  if (!lsSet("lm-r:" + state.activeProfile, data)) {
    // Quota exceeded — retry without abstracts so results at least survive a reload
    lsSet("lm-r:" + state.activeProfile, { ...data, papers: papers.map(p => ({ ...p, abstract: (p.abstract || "").slice(0, 400) })) });
  }
}

// ============================================================
// NETWORK HELPERS
// ============================================================
const sleep = ms => new Promise(r => setTimeout(r, ms));

// Hosts that refused us with 429 during the current search — skipped instead of waited on
const rateLimitedHosts = new Set();
const hostOf = url => { try { return new URL(url).host; } catch { return ""; } };

// fetch with a timeout and retries on 429 / 5xx / network errors (honours short Retry-After)
async function fetchWithRetry(url, opts = {}, { retries = 2, timeout = 25000, backoff = 1500 } = {}) {
  const host = hostOf(url);
  if (rateLimitedHosts.has(host)) return new Response(JSON.stringify({ error: "rate-limited earlier in this search" }), { status: 429 });
  for (let attempt = 0; ; attempt++) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeout);
    try {
      const r = await fetch(url, { ...opts, signal: ctrl.signal });
      if (r.status === 429) {
        const ra = parseFloat(r.headers.get("retry-after"));
        // A long (or daily-budget) limit won't clear by waiting — give up on this host for now
        if (attempt >= retries || !(ra <= 20) && host === "api.openalex.org") { rateLimitedHosts.add(host); return r; }
        await sleep(Number.isFinite(ra) ? Math.min(ra, 20) * 1000 : backoff * 2 ** attempt);
        continue;
      }
      if (r.status >= 500 && attempt < retries) { await sleep(backoff * 2 ** attempt); continue; }
      return r;
    } catch (e) {
      const err = e.name === "AbortError" ? new Error(`timed out after ${Math.round(timeout / 1000)}s`) : e;
      if (attempt >= retries) throw err;
      await sleep(backoff * 2 ** attempt);
    } finally { clearTimeout(timer); }
  }
}

async function fetchJson(url, opts, cfg) {
  const r = await fetchWithRetry(url, opts, cfg);
  if (r.status === 429 && hostOf(url) === "api.openalex.org") {
    throw new Error(state.openalexKey
      ? "OpenAlex budget for your API key is used up (resets at midnight UTC)"
      : "OpenAlex free daily budget for your network is used up — add a free OpenAlex API key in Configure");
  }
  if (!r.ok) throw new Error(r.status === 429 ? "rate-limited (429)" : `HTTP ${r.status}`);
  return r.json();
}

// OpenAlex auth: personal API key (own budget) if set, else the shared per-IP free budget
const oaAuth = () => state.openalexKey ? `api_key=${encodeURIComponent(state.openalexKey)}` : `mailto=${MAILTO}`;

// Run fn over items with at most `limit` in flight
async function mapLimit(items, limit, fn) {
  const results = new Array(items.length);
  let next = 0;
  const workers = Array.from({ length: Math.min(limit, items.length) }, async () => {
    while (next < items.length) { const i = next++; results[i] = await fn(items[i], i); }
  });
  await Promise.all(workers);
  return results;
}

const cleanDoi = d => String(d || "").toLowerCase().replace(/^https?:\/\/(dx\.)?doi\.org\//, "").replace(/[.,;)\]]+$/, "").trim();
const stripTags = s => String(s || "").replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
const pad2 = n => String(n).padStart(2, "0");
const MONTHS = { jan:1, feb:2, mar:3, apr:4, may:5, jun:6, jul:7, aug:8, sep:9, oct:10, nov:11, dec:12 };
// Build an ISO-ish date (YYYY, YYYY-MM or YYYY-MM-DD) from loose parts so dates sort correctly
function isoDate(y, m, d) {
  if (!y) return "";
  let mm = m == null || m === "" ? null : (MONTHS[String(m).slice(0, 3).toLowerCase()] || parseInt(m));
  if (!mm) return String(y);
  return d ? `${y}-${pad2(mm)}-${pad2(parseInt(d))}` : `${y}-${pad2(mm)}`;
}

// Convert "Last, F. M.; Last2, A." (bioRxiv) or "Last FM, Last2 A" (Europe PMC/PubMed style)
// into "F. M. Last, A. Last2" so every source uses the same first-name-first order for author matching.
function normalizeAuthorList(str, style) {
  const parts = style === "semicolon" ? String(str || "").split(/\s*;\s*/) : String(str || "").replace(/\.$/, "").split(/\s*,\s*/);
  return parts.map(a => {
    a = a.trim();
    if (!a) return "";
    let last, init;
    if (style === "semicolon") {
      const m = a.match(/^([^,]+),\s*(.+)$/);
      if (!m) return a;
      [, last, init] = m;
      // "F. M." stays; full forenames ("Nicola") stay as written
      return `${init.trim()} ${last.trim()}`;
    }
    const m = a.match(/^(.+?)\s+([A-Z]{1,4})$/);   // "Pelt DM" → initials "DM"
    if (!m) return a;
    [, last, init] = m;
    return `${init.split("").map(c => c + ".").join(" ")} ${last}`;
  }).filter(Boolean).join(", ");
}

// Search terms sent to the databases: tier keywords + the profile's extra broad terms.
// (Scoring always uses the tier keywords, so broad terms only widen recall.)
function splitList(s) { return String(s || "").split(/[,;\n]/).map(x => x.trim()).filter(Boolean); }
function searchTerms(profile, { t2 = Infinity, t3 = 0 } = {}) {
  const tiers = profile.tiers || {};
  return [...new Set([
    ...splitList(profile.extraSearchTerms),
    ...(tiers.tier1?.keywords || []),
    ...(tiers.tier2?.keywords || []).slice(0, t2),
    ...(tiers.tier3?.keywords || []).slice(0, t3)
  ].map(s => s.trim()).filter(Boolean))];
}

// ============================================================
// LLM SEARCH (optional add-on to the direct database APIs)
// ============================================================
const SEARCH_SYSTEM = `You are a scientific literature search tool. Find REAL papers published recently.

ABSOLUTE RULES:
1. ONLY report papers found via web search. NEVER fabricate papers.
2. Every paper MUST have a real URL from search results. Include the DOI whenever one exists.
3. If zero papers found, return exactly: []
4. NEVER invent titles, authors, DOIs, or URLs.
5. Only include papers published within the specified date range.
6. If uncertain about date, EXCLUDE the paper.

Return ONLY a JSON array. No markdown, no prose.
Format: [{"title":"...","authors":"...","date":"YYYY-MM-DD","url":"...","source":"...","abstract":"...","doi":"..."}]
Empty: []`;

let claudeFallbackHeaderOK = true;
async function callClaude(prompt, system, apiKey, { effort = "low", maxTokens = 16000 } = {}) {
  const messages = [{ role: "user", content: prompt }];
  let text = "";
  // Server-side web search can pause long turns (stop_reason "pause_turn"); resume up to 3 times
  for (let turn = 0; turn < 4; turn++) {
    const headers = { "Content-Type": "application/json", "x-api-key": apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" };
    const body = { model: CLAUDE_MODEL, max_tokens: maxTokens, system, messages, output_config: { effort },
      tools: [{ type: "web_search_20260209", name: "web_search", max_uses: 8 }] };
    if (claudeFallbackHeaderOK) { headers["anthropic-beta"] = "server-side-fallback-2026-07-01"; body.fallbacks = "default"; }
    let r;
    try {
      r = await fetchWithRetry("https://api.anthropic.com/v1/messages", { method: "POST", headers, body: JSON.stringify(body) }, { retries: 2, timeout: 300000, backoff: 4000 });
    } catch (e) {
      // If the browser rejected the beta header (CORS), retry once without the refusal-fallback feature
      if (claudeFallbackHeaderOK && e instanceof TypeError) { claudeFallbackHeaderOK = false; turn--; continue; }
      throw e;
    }
    const data = await r.json().catch(() => ({}));
    if (data.error) throw new Error(data.error.message || `Anthropic API error (HTTP ${r.status})`);
    if (data.stop_reason === "refusal") throw new Error("Claude declined this request" + (data.stop_details?.explanation ? `: ${data.stop_details.explanation}` : "."));
    text += (data.content || []).filter(b => b.type === "text").map(b => b.text).join("");
    if (data.stop_reason !== "pause_turn") break;
    messages.push({ role: "assistant", content: data.content });
  }
  return text;
}

async function searchAnthropic(prompt, apiKey) {
  return parseJsonPapers(await callClaude(prompt, SEARCH_SYSTEM, apiKey, { effort: "low" }));
}

// ============================================================
// Gemini API — Google Search grounding for paper discovery + review
// ============================================================
async function callGemini(prompt, systemPrompt, geminiKey, { search = true } = {}) {
  // Try the configured model, then Google's rolling "latest flash" alias (older model IDs get retired)
  const models = [...new Set([(state.geminiModel || DEFAULT_GEMINI_MODEL).trim(), GEMINI_FALLBACK_MODEL])];
  let lastErr = null;
  for (const model of models) {
    const r = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": geminiKey },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: systemPrompt }] },
        contents: [{ role: "user", parts: [{ text: prompt }] }],
        ...(search ? { tools: [{ google_search: {} }] } : {})
      })
    }, { retries: 2, timeout: 180000, backoff: 3000 });
    const data = await r.json().catch(() => ({}));
    if (r.status === 404 || data.error?.status === "NOT_FOUND") {
      lastErr = new Error(`Gemini model "${model}" is not available — set a current model name in Configure.`);
      continue;
    }
    if (data.error) throw new Error(data.error.message || `Gemini API error (HTTP ${r.status})`);
    const cand = data.candidates?.[0];
    if (!cand) throw new Error(data.promptFeedback?.blockReason ? `Gemini blocked the prompt (${data.promptFeedback.blockReason})` : "Gemini returned no answer");
    return (cand.content?.parts || []).filter(p => !p.thought).map(p => p.text || "").filter(Boolean).join("\n");
  }
  throw lastErr;
}

async function searchGemini(prompt, geminiKey) {
  const text = await callGemini(prompt, SEARCH_SYSTEM, geminiKey);
  return parseJsonPapers(text);
}

// Extract the first JSON value of the given kind ("[" or "{") from free-form model output
function extractJson(text, open) {
  const cleaned = String(text || "").replace(/```(?:json)?/gi, "").trim();
  try { return JSON.parse(cleaned); } catch {}
  const close = open === "[" ? "]" : "}";
  const end = cleaned.lastIndexOf(close);
  for (let i = cleaned.indexOf(open); i !== -1 && i < end; i = cleaned.indexOf(open, i + 1)) {
    try { return JSON.parse(cleaned.slice(i, end + 1)); } catch {}
  }
  return null;
}

// ============================================================
// Gemini AI helpers: keyword suggestion + author verification
// ============================================================
async function geminiSuggestKeywords(profile, geminiKey) {
  const existing = Object.entries(profile.tiers).map(([k,t]) =>
    `${t.label} (${k}, +${t.score}pts): ${t.keywords.join(", ")}`
  ).join("\n");

  const prompt = `I'm building a literature monitoring tool for this research area:

**Profile:** ${profile.name}
**Description:** ${profile.description}

**Current keywords by tier:**
${existing}

Suggest additional keywords I'm missing for each tier. Think about:
- Spelling variants, hyphenation differences, abbreviations
- Related techniques and methods used in this field
- Common terminology in recent papers (last two years)
- Competing/complementary methods
- Key instruments, software tools, or facilities
- Don't repeat keywords I already have
- Keywords are matched as phrases against titles and abstracts, so prefer 1-4 word phrases authors actually write

Return ONLY a JSON object with this format (no markdown, no prose):
{"tier1": ["keyword1", "keyword2"], "tier2": ["keyword1", "keyword2"], "tier3": ["keyword1", "keyword2"]}

Each tier should have 5-15 suggestions. tier1 = most specific to my core technique, tier2 = adjacent methods, tier3 = broader field.`;

  const text = await callGemini(prompt, "You are a scientific literature search expert. Return only valid JSON. No markdown fences, no explanations.", geminiKey);
  const obj = extractJson(text, "{");
  return obj && typeof obj === "object" && !Array.isArray(obj) ? obj : null;
}

async function geminiVerifyAuthor(name, affiliation, note, geminiKey) {
  const prompt = `Find the OpenAlex Author ID for this researcher:

**Name:** ${name}
**Affiliation:** ${affiliation || "unknown"}
**Research area:** ${note || "unknown"}

Search Google for their OpenAlex author page (openalex.org/authors/...) or their ORCID profile.

Return ONLY a JSON object (no markdown, no prose):
{"openalexId": "https://openalex.org/A...", "name": "Full Name As Found", "institution": "Current Institution", "orcid": "https://orcid.org/... or empty", "works_count": number, "confidence": "high/medium/low"}

If you cannot find them with confidence, return: {"openalexId": "", "confidence": "low", "note": "reason"}`;

  const text = await callGemini(prompt, "You are a research author disambiguation tool. Return only valid JSON.", geminiKey);
  return extractJson(text, "{");
}

function parseJsonPapers(text) {
  const a = extractJson(text, "[");
  return Array.isArray(a) ? a.filter(p => p && p.title && (p.url || p.doi)) : [];
}

// Similar-title check used to confirm AI-reported papers against a real database record
function titleTokens(t) { return new Set((t || "").toLowerCase().normalize("NFKD").replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter(w => w.length > 2)); }
function titlesMatch(a, b) {
  const A = titleTokens(a), B = titleTokens(b);
  if (!A.size || !B.size) return false;
  let inter = 0; for (const w of A) if (B.has(w)) inter++;
  return inter / (A.size + B.size - inter) >= 0.75;
}

// Anti-hallucination: keep an AI-reported paper only if OpenAlex knows it (by DOI, else by title),
// and replace the model's metadata with the database record.
async function verifyAiPapers(papers, startDate) {
  const slack = new Date(new Date(startDate) - 30 * 864e5).toISOString().slice(0, 10);
  const verified = await mapLimit(papers, 4, async p => {
    try {
      let work = null;
      const doi = cleanDoi(p.doi || (String(p.url || "").match(/10\.\d{4,9}\/[^\s?#"]+/) || [])[0]);
      if (doi) {
        const r = await fetchWithRetry(`https://api.openalex.org/works/https://doi.org/${doi}?${oaAuth()}`, {}, { retries: 1 });
        if (r.ok) work = await r.json();
      }
      if (!work && p.title) {
        const d = await fetchJson(`https://api.openalex.org/works?search=${encodeURIComponent(p.title.slice(0, 200))}&per_page=5&${oaAuth()}`, {}, { retries: 1 });
        work = (d.results || []).find(w => titlesMatch(w.title, p.title)) || null;
      }
      if (!work || !titlesMatch(work.title, p.title)) return null;
      const v = oaWorkToPaper(work);
      if (v.date && v.date < slack) return null;  // real paper, but older than the window
      return { ...v, abstract: v.abstract || p.abstract || "" };
    } catch { return null; }
  });
  return verified.filter(Boolean);
}

// DIRECT DATABASE APIS (no key needed)
// ============================================================

// bioRxiv: full scan of every new preprint in the window (30 per page), filtered by subject category.
async function searchBiorxiv(startDate, endDate, profile) {
  const cats = new Set(splitList(profile.biorxivCategories).map(s => s.toLowerCase()));
  const MAX_RECORDS = 3000;  // ~100 pages; beyond that Europe PMC + OpenAlex cover bioRxiv by keyword
  const toPapers = coll => coll
    .filter(item => (!cats.size || cats.has((item.category || "").toLowerCase().trim())) && String(item.version || "1") === "1")
    .map(item => ({
      title: item.title || "", abstract: item.abstract || "", authors: normalizeAuthorList(item.authors, "semicolon"),
      doi: item.doi || "", date: item.date || "",
      url: item.doi ? `https://doi.org/${item.doi}` : "",
      source: "bioRxiv"
    }));
  const page = cursor => fetchJson(`https://api.biorxiv.org/details/biorxiv/${startDate}/${endDate}/${cursor}`, {}, { retries: 1, timeout: 15000 });
  const deadline = Date.now() + 60000;  // a slow bioRxiv must not stall the whole search
  const first = await fetchJson(`https://api.biorxiv.org/details/biorxiv/${startDate}/${endDate}/0`, {}, { retries: 2, timeout: 20000 });
  const firstColl = first.collection || [];
  const msg = (first.messages || [{}])[0] || {};
  const total = Math.min(parseInt(msg.total) || firstColl.length, MAX_RECORDS);
  const step = parseInt(msg.count) || firstColl.length || 30;
  const cursors = [];
  for (let c = step; c < total; c += step) cursors.push(c);
  let skipped = 0;
  const rest = await mapLimit(cursors, 6, async c => {
    if (Date.now() > deadline) { skipped++; return []; }
    try { return (await page(c)).collection || []; } catch(e) { console.warn("bioRxiv page", c, e); skipped++; return []; }
  });
  const papers = toPapers(firstColl.concat(...rest));
  papers._note = skipped ? `${skipped} of ${cursors.length + 1} pages unavailable (slow server)` : (parseInt(msg.total) || 0) > MAX_RECORDS ? `capped at ${MAX_RECORDS} of ${msg.total}` : "";
  return papers;
}

// PubMed: phrase search in title/abstract, by date added to PubMed (catches epub-ahead-of-print too).
async function searchPubmed(terms, days) {
  const query = terms.slice(0, 40).map(k => `"${k.replace(/["\[\]]/g, "")}"[tiab]`).join(" OR ");
  const base = "https://eutils.ncbi.nlm.nih.gov/entrez/eutils";
  const tool = `&tool=lit-monitor&email=${MAILTO}`;
  const d1 = await fetchJson(`${base}/esearch.fcgi?db=pubmed&term=${encodeURIComponent(query)}&retmax=200&retmode=json&datetype=edat&reldate=${days}&sort=date${tool}`, {}, { retries: 3 });
  const ids = (d1.esearchresult || {}).idlist || [];
  if (!ids.length) return [];
  await sleep(400);  // NCBI allows 3 requests/second without a key
  const r2 = await fetchWithRetry(`${base}/efetch.fcgi?db=pubmed&id=${ids.join(",")}&retmode=xml${tool}`, {}, { retries: 3, timeout: 40000 });
  if (!r2.ok) throw new Error(`PubMed efetch: HTTP ${r2.status}`);
  const doc = new DOMParser().parseFromString(await r2.text(), "text/xml");
  const papers = [];
  for (const art of doc.querySelectorAll("PubmedArticle")) {
    const title = art.querySelector("ArticleTitle")?.textContent || "";
    const abstract = Array.from(art.querySelectorAll("AbstractText")).map(a => (a.getAttribute("Label") ? a.getAttribute("Label") + ": " : "") + a.textContent).join(" ");
    const auths = Array.from(art.querySelectorAll("AuthorList > Author")).map(a => {
      const l = a.querySelector("LastName")?.textContent || a.querySelector("CollectiveName")?.textContent || "";
      const f = a.querySelector("ForeName")?.textContent || a.querySelector("Initials")?.textContent || "";
      return l ? (f ? `${f} ${l}` : l) : "";
    }).filter(Boolean).join(", ");
    const pmid = art.querySelector("MedlineCitation > PMID")?.textContent || "";
    let doi = "";
    for (const id of art.querySelectorAll("ArticleIdList > ArticleId")) { if (id.getAttribute("IdType") === "doi") doi = id.textContent; }
    // Prefer the electronic publication date; fall back to the issue date
    const ad = art.querySelector("ArticleDate"), pd = art.querySelector("JournalIssue PubDate");
    const pick = (el, sel) => el?.querySelector(sel)?.textContent;
    const date = ad ? isoDate(pick(ad, "Year"), pick(ad, "Month"), pick(ad, "Day"))
      : pd ? (isoDate(pick(pd, "Year"), pick(pd, "Month"), pick(pd, "Day")) || (pick(pd, "MedlineDate") || "").slice(0, 4)) : "";
    const journal = art.querySelector("Journal > ISOAbbreviation")?.textContent || art.querySelector("Journal > Title")?.textContent || "PubMed";
    papers.push({ title, abstract, authors: auths, doi, date, url: pmid ? `https://pubmed.ncbi.nlm.nih.gov/${pmid}/` : (doi ? `https://doi.org/${doi}` : ""), source: journal });
  }
  return papers;
}

// Europe PMC: PubMed + preprints (bioRxiv, medRxiv, Research Square, arXiv q-bio…) with phrase search on title/abstract.
async function searchEuropePmc(terms, startDate, endDate) {
  const q = `(${terms.slice(0, 40).map(t => `TITLE_ABS:"${t.replace(/["()]/g, "")}"`).join(" OR ")}) AND FIRST_PDATE:[${startDate} TO ${endDate}]`;
  const papers = [];
  let cursor = "*";
  for (let pageNo = 0; pageNo < 4; pageNo++) {
    const d = await fetchJson(`https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=${encodeURIComponent(q)}&format=json&resultType=core&pageSize=100&cursorMark=${encodeURIComponent(cursor)}`, {}, { retries: 2, timeout: 30000 });
    const list = d.resultList?.result || [];
    for (const it of list) {
      const doi = it.doi || "";
      const src = it.source === "PPR" ? (it.bookOrReportDetails?.publisher || "Preprint") : (it.journalInfo?.journal?.title || "Europe PMC");
      papers.push({
        title: stripTags(it.title).replace(/\.$/, ""), abstract: stripTags(it.abstractText), authors: normalizeAuthorList(it.authorString, "initials"),
        doi, date: it.firstPublicationDate || "",
        url: doi ? `https://doi.org/${doi}` : `https://europepmc.org/article/${it.source}/${it.id}`,
        source: src
      });
    }
    if (!d.nextCursorMark || d.nextCursorMark === cursor || list.length < 100) break;
    cursor = d.nextCursorMark;
  }
  return papers;
}

// ============================================================
// OpenAlex API — covers ALL major journals, preprints (incl. arXiv), proceedings
// Free, no key needed. 250M+ scholarly works.
// ============================================================
function reconstructAbstract(idx) {
  if (!idx) return "";
  const words = [];
  for (const [word, positions] of Object.entries(idx)) {
    for (const pos of positions) words[pos] = word;
  }
  return words.filter(w => w !== undefined).join(" ");
}

const oaShortId = id => String(id || "").replace(/.*\//, "");

async function searchOpenAlex(terms, startDate, endDate, authors) {
  const papers = [];
  let firstErr = null, okQueries = 0;
  const select = "id,doi,title,publication_date,authorships,primary_location,abstract_inverted_index,type";
  // Scholarly work types only — OpenAlex also indexes datasets, data-portal queries, paratext, etc.
  const dateFilter = `from_publication_date:${startDate},to_publication_date:${endDate},type:article|preprint|review|letter|book-chapter`;

  // Strategy 1: phrase search restricted to title + abstract (full-text search adds too much noise).
  // Commas would split the filter, so strip them; batch ~6 phrases per boolean query.
  const phrases = terms.map(t => `"${t.replace(/[",|]/g, " ").trim()}"`);
  const batches = [];
  for (let i = 0; i < phrases.length && batches.length < 10; i += 6) batches.push(phrases.slice(i, i + 6).join(" OR "));
  await mapLimit(batches, 3, async query => {
    try {
      const data = await fetchJson(`https://api.openalex.org/works?filter=title_and_abstract.search:${encodeURIComponent(query)},${dateFilter}&per_page=100&select=${select}&${oaAuth()}`);
      for (const work of (data.results || [])) papers.push(oaWorkToPaper(work));
      okQueries++;
    } catch(e) { console.warn("OpenAlex keyword query failed:", e); firstErr ||= e; }
  });

  // Strategy 2: AUTHOR ID search — exact disambiguation via OpenAlex Author IDs (no false positives)
  const authorsWithIds = (authors || []).filter(a => a.openalexId);
  const idBatches = [];
  for (let i = 0; i < authorsWithIds.length; i += 25) idBatches.push(authorsWithIds.slice(i, i + 25));
  await mapLimit(idBatches, 2, async batch => {
    const idFilter = batch.map(a => oaShortId(a.openalexId)).join("|");
    for (let pageNo = 1; pageNo <= 4; pageNo++) {
      try {
        const data = await fetchJson(`https://api.openalex.org/works?filter=authorships.author.id:${idFilter},${dateFilter}&sort=publication_date:desc&per_page=100&page=${pageNo}&select=${select}&${oaAuth()}`);
        for (const work of (data.results || [])) papers.push(oaWorkToPaper(work));
        okQueries++;
        if ((data.results || []).length < 100) break;
      } catch(e) { console.warn("OpenAlex author ID query failed:", e); firstErr ||= e; break; }
    }
  });

  // Strategy 3: Fallback author-name search for authors WITHOUT IDs (less reliable — scoring re-checks names)
  const searchableAuthors = (authors || []).filter(a => !a.openalexId && a.last && !COMMON_LASTNAMES.has(a.last.toLowerCase()));
  const nameBatches = [];
  for (let i = 0; i < searchableAuthors.length && nameBatches.length < 6; i += 4) nameBatches.push(searchableAuthors.slice(i, i + 4));
  await mapLimit(nameBatches, 2, async batch => {
    const q = batch.map(a => `"${`${a.first || ""} ${a.last}`.trim().replace(/[",|]/g, " ")}"`).join(" OR ");
    try {
      const data = await fetchJson(`https://api.openalex.org/works?filter=raw_author_name.search:${encodeURIComponent(q)},${dateFilter}&per_page=100&select=${select}&${oaAuth()}`);
      for (const work of (data.results || [])) papers.push(oaWorkToPaper(work));
      okQueries++;
    } catch(e) { console.warn("OpenAlex author name query failed:", e); firstErr ||= e; }
  });
  if (!okQueries && firstErr) throw firstErr;
  if (firstErr) papers._note = "some queries failed";
  return papers;
}

// Look up OpenAlex Author ID candidates by name
// Tries autocomplete first, then full authors search API as fallback
async function lookupAuthorId(query, affiliation) {
  let results = [];

  // Strategy 1: Autocomplete API (fast, good for common names)
  try {
    const data = await fetchJson(`https://api.openalex.org/autocomplete/authors?q=${encodeURIComponent(query)}&${oaAuth()}`, {}, { retries: 1 });
    results = (data.results || []).map(item => ({
      id: item.id,
      shortId: oaShortId(item.id),
      name: item.display_name,
      hint: item.hint || "",
      works: item.works_count || 0,
      cited: item.cited_by_count || 0,
      orcid: item.external_id || ""
    }));
  } catch(e) { console.warn("Autocomplete failed:", e); }

  // Strategy 2: Full authors search (more comprehensive, catches names autocomplete misses)
  if (results.length < 3) {
    try {
      const data = await fetchJson(`https://api.openalex.org/authors?search=${encodeURIComponent(query)}&per_page=10&${oaAuth()}`, {}, { retries: 1 });
      const seenIds = new Set(results.map(r => r.id));
      for (const item of (data.results || [])) {
        if (seenIds.has(item.id)) continue;
        const inst = (item.last_known_institutions || []).map(i => i.display_name).join(", ");
        results.push({
          id: item.id,
          shortId: oaShortId(item.id),
          name: item.display_name,
          hint: inst || "",
          works: item.works_count || 0,
          cited: item.cited_by_count || 0,
          orcid: item.orcid || item.ids?.orcid || ""
        });
      }
    } catch(e) { console.warn("Authors search failed:", e); }
  }

  // Rank candidates whose institution matches the stored affiliation first
  const affWords = String(affiliation || "").toLowerCase().split(/[\s,.()/-]+/).filter(w => w.length > 3);
  const affHit = c => affWords.some(w => (c.hint || "").toLowerCase().includes(w)) ? 1 : 0;
  results.sort((x, y) => affHit(y) - affHit(x) || y.works - x.works);
  return results.slice(0, 10);
}

function oaWorkToPaper(work) {
  const abstract = reconstructAbstract(work.abstract_inverted_index);
  const authors = (work.authorships || []).map(a => a.author?.display_name || "").filter(Boolean).join(", ");
  const journal = work.primary_location?.source?.display_name || "";
  const doi = cleanDoi(work.doi);
  // Extract OpenAlex author IDs for ground-truth matching
  const openalexAuthorIds = (work.authorships || []).map(a => a.author?.id || "").filter(Boolean);
  return {
    title: stripTags(work.title || ""), abstract, authors, doi,
    date: work.publication_date || "",
    url: doi ? `https://doi.org/${doi}` : (work.primary_location?.landing_page_url || work.id || ""),
    source: journal || "OpenAlex",
    _openalexAuthorIds: openalexAuthorIds
  };
}

// ============================================================
// CrossRef API — every DOI-registered publication
// Covers Optica/OSA, IUCr, APS, AIP, Elsevier, Wiley, Springer
// ============================================================
async function searchCrossRef(terms, startDate, endDate, authors) {
  const papers = [];
  const filter = `from-pub-date:${startDate},until-pub-date:${endDate},type:journal-article,type:posted-content,type:proceedings-article`;
  // Relevance-ranked (CrossRef's default) — sorting by date would return the newest *loosely* matching items
  await mapLimit(terms.slice(0, 10), 2, async kw => {
    try {
      const data = await fetchJson(`https://api.crossref.org/works?query.bibliographic=${encodeURIComponent(kw)}&filter=${filter}&rows=25&mailto=${MAILTO}`, {}, { retries: 2, timeout: 30000 });
      for (const item of (data.message?.items || [])) papers.push(crItemToPaper(item));
    } catch(e) { console.warn("CrossRef query failed:", e); }
  });
  // Author queries — watched authors with uncommon names (scoring re-verifies the name)
  const searchable = (authors || []).filter(a => a.last && !COMMON_LASTNAMES.has(a.last.toLowerCase()) && a.last.length > 3).slice(0, 12);
  await mapLimit(searchable, 2, async a => {
    try {
      const data = await fetchJson(`https://api.crossref.org/works?query.author=${encodeURIComponent(`${a.first || ""} ${a.last}`.trim())}&filter=${filter}&rows=15&mailto=${MAILTO}`, {}, { retries: 2, timeout: 30000 });
      for (const item of (data.message?.items || [])) papers.push(crItemToPaper(item));
    } catch(e) { console.warn("CrossRef author query failed:", e); }
  });
  return papers;
}

function crItemToPaper(item) {
  const title = stripTags((item.title || [])[0] || "");
  const authors = (item.author || []).map(a => `${a.given || ""} ${a.family || a.name || ""}`.trim()).filter(Boolean).join(", ");
  const doi = item.DOI || "";
  const parts = (item.published || item["published-online"] || item["published-print"] || item.issued)?.["date-parts"]?.[0] || [];
  const date = isoDate(parts[0], parts[1], parts[2]);
  const journal = (item["container-title"] || [])[0] || (item.subtype === "preprint" ? (item.institution?.[0]?.name || "Preprint") : "");
  const abstract = stripTags(item.abstract).replace(/^Abstract\s*/i, "");
  return { title, abstract, authors, doi, date, url: doi ? `https://doi.org/${doi}` : (item.URL || ""), source: journal || "CrossRef" };
}

// ============================================================
// Semantic Scholar API — 200M+ papers. The anonymous rate limit is shared and strict,
// so we send few, sequential queries and back off on 429.
// ============================================================
async function searchSemanticScholar(terms, startDate, endDate) {
  const papers = [];
  let rateLimited = 0;
  for (const term of terms.slice(0, 8)) {
    try {
      const url = `https://api.semanticscholar.org/graph/v1/paper/search?query=${encodeURIComponent(term)}&publicationDateOrYear=${startDate}:${endDate}&fields=title,authors,abstract,externalIds,publicationDate,venue,url&limit=50`;
      const r = await fetchWithRetry(url, {}, { retries: 1, backoff: 2500 });
      // Pool saturated — further queries would only add waiting time to every search
      if (r.status === 429) { rateLimited++; break; }
      if (!r.ok) { console.warn("S2 search", r.status); continue; }
      const data = await r.json();
      for (const p of (data.data || [])) {
        const doi = p.externalIds?.DOI || "";
        papers.push({
          title: p.title || "",
          abstract: p.abstract || "",
          authors: (p.authors || []).map(a => a.name || "").filter(Boolean).join(", "),
          doi,
          date: p.publicationDate || "",
          url: doi ? `https://doi.org/${doi}` : (p.externalIds?.ArXiv ? `https://arxiv.org/abs/${p.externalIds.ArXiv}` : (p.url || `https://www.semanticscholar.org/paper/${p.paperId}`)),
          source: p.venue || (p.externalIds?.ArXiv ? "arXiv" : "Semantic Scholar")
        });
      }
      await sleep(1100);  // ~1 request/second keeps the anonymous pool happy
    } catch(e) { console.warn("S2 query failed:", e); }
  }
  // The shared anonymous pool is often saturated; that's a soft failure, not an error
  if (rateLimited) papers._note = papers.length ? "partly rate-limited" : "busy — rate-limited, try again later";
  return papers;
}

function buildAnthropicQueries(profile) {
  const end = new Date(), start = new Date(end - profile.lookbackDays * 864e5);
  const ds = d => d.toISOString().split("T")[0];
  const ctx = profile.description ? `\nResearch context: ${profile.description}` : "";
  const range = `published between ${ds(start)} and ${ds(end)}${ctx}\n`;
  const queries = [];
  const t1 = profile.tiers.tier1?.keywords || [];
  if (t1.length) queries.push({ label: `Searching ${profile.tiers.tier1.label}…`, prompt: `Find scientific papers ${range} about:\n${t1.join("\n")}\n\nSearch bioRxiv, arXiv, PubMed and journal sites. Include each paper\'s DOI.` });
  const auths = (profile.authors || []).slice(0, 16);
  if (auths.length) queries.push({ label: "Checking watched authors…", prompt: `Find papers ${range} by: ${auths.map(a=>`${a.first} ${a.last}`).join(", ")}.\nSearch bioRxiv, arXiv, PubMed, Google Scholar. Include each paper\'s DOI.` });
  const t2 = profile.tiers.tier2?.keywords || [];
  if (t2.length) queries.push({ label: `Scanning ${profile.tiers.tier2.label}…`, prompt: `Find papers ${range} about:\n${t2.slice(0,10).join("\n")}\n\nSearch bioRxiv, arXiv, PubMed and journal sites. Include each paper\'s DOI.` });
  const t3 = profile.tiers.tier3?.keywords || [];
  if (t3.length > 4) queries.push({ label: `Scanning ${profile.tiers.tier3.label}…`, prompt: `Find papers ${range} about:\n${t3.slice(0,8).join("\n")}\n\nSearch bioRxiv, arXiv, PubMed and journal sites. Include each paper\'s DOI.` });
  return queries;
}

// ============================================================
// SCORING
// ============================================================
// Common last names — require FULL first name match (module-scope for performance)
const COMMON_LASTNAMES = new Set([
  "lee","li","wang","zhang","liu","chen","yang","wu","kim","park","lin","huang",
  "schaefer","diaz","martin","brown","smith","taylor","wilson","moore","white",
  "young","king","john","garcia","müller","muller","schmidt","jones","davis",
  "miller","hall","hill","green","baker","carter","clark","adams","walker"
]);
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

// Strip accents so "Viganò", "Müller", "Daniël" match "Vigano", "Muller", "Daniel"
const foldAccents = s => String(s || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/ß/g, "ss").replace(/ø/g, "o").replace(/ł/g, "l");

// Normalize text for fuzzy matching across hyphenation/spacing variants
// "X-ray nano-holotomography" and "Xray nanoholotomography" both normalize the same way
function normalizeText(s) {
  const lower = foldAccents(s).toLowerCase().replace(/[‐-―−]/g, "-");  // unicode dashes → hyphen
  const spaced = lower.replace(/[-_/]/g, " ").replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
  return {
    spaced: " " + spaced + " ",          // padded so " word" checks give word boundaries
    joined: spaced.replace(/ /g, "")      // remove all whitespace + hyphens
  };
}

const kwCache = new Map();
function keywordInfo(keyword) {
  let k = kwCache.get(keyword);
  if (!k) {
    const n = normalizeText(keyword);
    const phrase = n.spaced.trim();
    // Significant words for the bag-of-words fallback (≥3 chars, not filler words)
    const words = phrase.split(" ").filter(w => w.length >= 3 && !STOPWORDS.has(w));
    k = { phrase, joined: n.joined, words };
    kwCache.set(keyword, k);
  }
  return k;
}
const STOPWORDS = new Set(["the","and","for","with","from","using","based","via","into","of","in","on"]);

// Returns 2 for an exact phrase match, 1 for a bag-of-words match (all words present), 0 otherwise.
function matchKeyword(textNorm, keyword) {
  const k = keywordInfo(keyword);
  if (!k.phrase) return 0;
  // Exact phrase match (with hyphenation/spacing tolerance), anchored at a word start
  if (textNorm.spaced.includes(" " + k.phrase)) return 2;
  // Joined form catches "nano tomography" vs "nanotomography"; require ≥8 chars to avoid accidental hits
  if (k.joined.length >= 8 && textNorm.joined.includes(k.joined)) return 2;
  // Bag-of-words: every significant word appears as a word start (so "ray" won't match "array")
  if (k.words.length >= 2 && k.words.every(w => textNorm.spaced.includes(" " + w))) return 1;
  return 0;
}
// Kept for callers that only need a boolean
const fuzzyContains = (textNorm, keyword) => matchKeyword(textNorm, keyword) > 0;

function scorePaper(paper, profile) {
  const titleNorm = normalizeText(paper.title || "");
  const abstractNorm = normalizeText(paper.abstract || "");
  const fullTextNorm = {
    spaced: titleNorm.spaced + abstractNorm.spaced,
    joined: titleNorm.joined + " " + abstractNorm.joined
  };
  // Accent-folded author string, single-spaced, for name matching
  const authStr = foldAccents(paper.authors || "").replace(/\s+/g, " ");
  let score = 0;
  const reasons = [];
  let hasTier1Anywhere = false;
  let hasTier2Anywhere = false;
  let hasVerifiedAuthor = false;
  let numKwMatches = 0;

  // Keyword matching: exact phrase = full tier score, all-words-present = half; title hits get +50%
  for (const [k, tier] of Object.entries(profile.tiers)) {
    for (const kw of (tier.keywords||[])) {
      if (!kw) continue;
      const m = matchKeyword(fullTextNorm, kw);
      if (!m) continue;
      const inTitle = matchKeyword(titleNorm, kw) === 2;
      let sc = m === 2 ? tier.score : Math.ceil(tier.score / 2);
      if (inTitle) sc = Math.round(sc * 1.5);
      score += sc;
      numKwMatches++;
      reasons.push({ tier: tier.label, tierKey: k, kw: kw + (inTitle ? " (title)" : m === 1 ? " (words)" : ""), sc });
      // A loose bag-of-words hit on tier 1/2 alone isn't strong enough to pass the relevance gate
      if (k === "tier1" && (m === 2 || numKwMatches >= 2)) hasTier1Anywhere = true;
      if (k === "tier2" && (m === 2 || numKwMatches >= 2)) hasTier2Anywhere = true;
    }
  }

  // Diversity bonus: papers matching many of your keywords are more likely on-topic
  // Multiplicative boost on the keyword score, capped at 2.5x for 6+ matches.
  if (numKwMatches >= 2) {
    const kwScore = score; // keyword score before bonus (no author score yet)
    const mult = Math.min(2.5, 1 + (numKwMatches - 1) * 0.3);
    const bonus = Math.round(kwScore * (mult - 1));
    score += bonus;
    reasons.push({ tier: "Diversity", kw: `${numKwMatches} keywords (×${mult.toFixed(2)})`, sc: bonus });
  }

  // Author matching — uses module-scope COMMON_LASTNAMES and escRe
  const matched = new Set();
  // Unicode-safe word boundaries (\b breaks on accented letters)
  const B = "(?<![A-Za-z])", E = "(?![A-Za-z])";

  for (const a of (profile.authors||[])) {
    const last = foldAccents(a.last||"").trim();
    const first = foldAccents(a.first||"").trim();
    const key = `${first} ${last}`.toLowerCase();
    if (!last || matched.has(key)) continue;
    const lastLow = last.toLowerCase();
    const firstLow = first.toLowerCase();
    const fi = escRe(firstLow.charAt(0));
    const middle = foldAccents(a.middle||"").trim().toLowerCase();
    const mi = escRe(middle.charAt(0));
    const L = escRe(last), F = escRe(firstLow);

    // PRIORITY 1: OpenAlex Author ID match (gold standard)
    if (a.openalexId) {
      if (paper._openalexAuthorIds?.length > 0) {
        // Paper has OpenAlex data — check IDs directly (most reliable)
        const aIdShort = oaShortId(a.openalexId);
        const found = paper._openalexAuthorIds.some(id => oaShortId(id) === aIdShort);
        if (found) {
          score += profile.authorScore;
          reasons.push({ tier: "Author ✓ID", kw: `${a.first} ${a.last}`, sc: profile.authorScore });
          matched.add(key);
          hasVerifiedAuthor = true;
        }
        continue; // Skip name matching — we have reliable ID data for this paper
      }
      // Paper has NO OpenAlex data (bioRxiv, PubMed, CrossRef) → fall through to strict name matching
    }

    if (!fi) continue;

    const lastRe = new RegExp(`${B}${L}${E}`, "i");
    if (!lastRe.test(authStr)) continue;

    // Detect double initials like "A.T." or "A. W." (require at least one dot to avoid matching "et al")
    // (All sources are normalised to first-name-first, so "Last, X. Y." would be the *next* author's initials)
    const doubleInitRe = new RegExp(`${B}[a-z]\\.\\s*[a-z]\\.?\\s+${L}${E}`, "i");
    const hasDoubleInitials = doubleInitRe.test(authStr);

    if (hasDoubleInitials) {
      let matched2 = false;
      if (mi) {
        const dblPatterns = [
          new RegExp(`${B}${L},?\\s+${fi}\\.?\\s*${mi}${E}`, "i"),
          new RegExp(`${B}${fi}\\.?\\s*${mi}\\.?\\s+${L}${E}`, "i"),
          new RegExp(`${B}${F}\\s+${mi}\\.?\\s+${L}${E}`, "i"),
          new RegExp(`${B}${F}\\s+${escRe(middle)}\\s+${L}${E}`, "i"),
        ];
        matched2 = dblPatterns.some(re => re.test(authStr));
      }
      if (!matched2 && firstLow.length > 2) {
        const fullRe = new RegExp(`${B}${F}${E}[\\s,.-]+${L}${E}`, "i");
        if (fullRe.test(authStr)) matched2 = true;
      }
      if (!matched2) continue;
    } else if (COMMON_LASTNAMES.has(lastLow)) {
      // Common name: require full first name, allow optional middle name/initial between first and last
      const fullPatterns = [
        new RegExp(`${B}${F}${E}(?:\\s+[^\\s,]+)?\\s+${L}${E}`, "i"),
        new RegExp(`${B}${L}[,\\s]+(?:[^\\s,]+\\s+)?${F}${E}`, "i")
      ];
      if (!fullPatterns.some(re => re.test(authStr))) continue;
    } else {
      // Non-common name: initial or full first name match, with optional middle
      const patterns = [
        new RegExp(`${B}${F}${E}(?:\\s+[^\\s,]+)?\\s+${L}${E}`, "i"),
        new RegExp(`${B}${fi}\\.?(?:\\s*[a-z]\\.?)?\\s+${L}${E}`, "i"),
        new RegExp(`${B}${L},?\\s+${fi}\\.?${E}`, "i"),
        new RegExp(`${B}${L},?\\s+${fi}[a-z]?${E}`, "i"),
        new RegExp(`${B}${L}\\s+${F}${E}`, "i")
      ];
      if (!patterns.some(re => re.test(authStr))) continue;
    }

    score += profile.authorScore;
    reasons.push({ tier: "Author", kw: `${a.first} ${a.last}`, sc: profile.authorScore });
    matched.add(key);
    hasVerifiedAuthor = true;
  }

  // Relevance gate: paper passes if ANY of these hold
  //  - Verified author match
  //  - tier1 / tier2 keyword phrase anywhere (very / reasonably specific terms)
  //  - 2+ keyword matches across any tiers (cross-keyword evidence)
  const hasCoreKw = hasTier1Anywhere || hasTier2Anywhere || numKwMatches >= 2;
  const isRelevant = hasVerifiedAuthor || hasCoreKw;

  return { ...paper, _score: score, _reasons: reasons.sort((x, y) => y.sc - x.sc), _relevant: isRelevant, _hasCoreKw: hasCoreKw, _hasAuthor: hasVerifiedAuthor };
}

// Merge duplicates (same DOI or same normalised title) across sources, keeping the richest metadata
function dedup(papers) {
  const byKey = new Map();
  const out = [];
  for (const p of papers) {
    if (!p || !p.title) continue;
    const doiKey = p.doi ? "doi:" + cleanDoi(p.doi) : null;
    const titleKey = "t:" + foldAccents(p.title).toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 60);
    const existing = (doiKey && byKey.get(doiKey)) || byKey.get(titleKey);
    if (!existing) {
      const rec = { ...p, doi: p.doi ? cleanDoi(p.doi) : "", _sources: [p.source].filter(Boolean) };
      out.push(rec);
      if (doiKey) byKey.set(doiKey, rec);
      byKey.set(titleKey, rec);
      continue;
    }
    // Fill gaps / prefer richer fields
    if ((p.abstract || "").length > (existing.abstract || "").length) existing.abstract = p.abstract;
    if ((p.authors || "").length > (existing.authors || "").length) existing.authors = p.authors;
    if (!existing.doi && p.doi) { existing.doi = cleanDoi(p.doi); byKey.set("doi:" + existing.doi, existing); }
    if (p.date && (!existing.date || (p.date.length > existing.date.length))) existing.date = p.date;
    if (p._openalexAuthorIds?.length && !existing._openalexAuthorIds?.length) existing._openalexAuthorIds = p._openalexAuthorIds;
    if (p.source && !existing._sources.includes(p.source)) existing._sources.push(p.source);
    // A named journal/preprint server is more informative than a database name
    if (/^(OpenAlex|CrossRef|Semantic Scholar|Europe PMC|PubMed)$/.test(existing.source) && p.source && !/^(OpenAlex|CrossRef|Semantic Scholar|Europe PMC|PubMed)$/.test(p.source)) existing.source = p.source;
    byKey.set(titleKey, existing);
  }
  return out;
}

// SEARCH ORCHESTRATION
// ============================================================
async function runSearch() {
  if (state.searching) return;
  if (state.isDraft) { state.message = { type: "warn", text: "Save this profile first, then run the search." }; render(); return; }
  const p = state.profile;
  const kwTotal = Object.values(p.tiers).reduce((s, t) => s + (t.keywords || []).length, 0);
  if (!kwTotal && !(p.authors || []).length) {
    state.message = { type: "warn", text: "This profile has no keywords or authors yet — add some in Configure (or use ✨ AI Suggest Keywords)." };
    render(); return;
  }
  state.searching = true; state.message = null; state.pipelineInfo = null;
  rateLimitedHosts.clear();
  const searchStart = performance.now();
  const end = new Date(), start = new Date(end - p.lookbackDays * 864e5);
  const ds = d => d.toISOString().split("T")[0];
  const startDate = ds(start), endDate = ds(end);

  // Each source runs independently and in parallel; one failing never blocks the others
  const sources = [
    { name: "bioRxiv",          run: () => searchBiorxiv(startDate, endDate, p) },
    { name: "PubMed",           run: () => searchPubmed(searchTerms(p, { t2: 12 }), p.lookbackDays) },
    { name: "Europe PMC",       run: () => searchEuropePmc(searchTerms(p, { t2: Infinity, t3: 6 }), startDate, endDate) },
    { name: "OpenAlex",         run: () => searchOpenAlex(searchTerms(p, { t2: Infinity, t3: 10 }), startDate, endDate, p.authors) },
    { name: "CrossRef",         run: () => searchCrossRef(searchTerms(p, { t2: 4 }), startDate, endDate, p.authors) },
    { name: "Semantic Scholar", run: () => searchSemanticScholar(searchTerms(p, { t2: 3 }), startDate, endDate) }
  ];
  const useGemini = (state.searchMode === "gemini" || state.searchMode === "both") && !!state.geminiKey;
  const useAnthropic = (state.searchMode === "anthropic" || state.searchMode === "both") && !!state.apiKey;
  if (useGemini || useAnthropic) {
    const queries = buildAnthropicQueries(p);
    const engines = [useGemini && ["Gemini", q => searchGemini(q.prompt, state.geminiKey)], useAnthropic && ["Claude", q => searchAnthropic(q.prompt, state.apiKey)]].filter(Boolean);
    for (const [engine, fn] of engines) {
      sources.push({ name: `${engine} search`, run: async () => {
        const found = [];
        await mapLimit(queries, 2, async q => { try { found.push(...await fn(q)); } catch(e) { console.warn(engine, "query failed:", e); if (!found._err) found._err = e; } });
        if (!found.length && found._err) throw found._err;
        // Only keep AI-reported papers that resolve to a real database record
        const verified = await verifyAiPapers(dedup(found), startDate);
        verified._note = `${verified.length}/${dedup(found).length} verified`;
        return verified;
      }});
    }
  }

  state.sourceStatus = Object.fromEntries(sources.map(s => [s.name, { status: "running" }]));
  state.progress = { current: 0, total: sources.length, label: "Querying databases in parallel…" };
  render();

  const settled = await Promise.all(sources.map(async s => {
    const t0 = performance.now();
    try {
      const papers = await s.run();
      state.sourceStatus[s.name] = { status: "done", count: papers.length, note: papers._note || "", secs: (performance.now() - t0) / 1000 };
      return papers;
    } catch(e) {
      console.warn(`${s.name} failed:`, e);
      state.sourceStatus[s.name] = { status: "error", error: e.message || String(e) };
      return [];
    } finally {
      state.progress.current++;
      if (state.view === "results") render();
    }
  }));

  try {
    const allPapers = settled.flat();
    const candidates = dedup(allPapers);
    const scored = candidates.map(pp => scorePaper(pp, p))
      .filter(pp => pp._relevant && pp._score >= p.minScore)
      .sort((a,b) => b._score - a._score || (b.date||"").localeCompare(a.date||""));

    // "New" = not seen in any earlier search of this profile
    const now = Date.now();
    for (const pp of scored) {
      const k = paperKey(pp);
      pp._new = !state.marks.seen[k];
      if (pp._new) state.marks.seen[k] = now;
    }
    // Keep the seen-list from growing forever (drop entries older than a year)
    for (const [k, t] of Object.entries(state.marks.seen)) if (now - t > 365 * 864e5) delete state.marks.seen[k];
    saveMarks();

    state.results = scored;
    saveResults(scored);

    const failed = Object.entries(state.sourceStatus).filter(([, s]) => s.status === "error").map(([n]) => n);
    const failNote = failed.length ? ` · ⚠ ${failed.join(", ")} failed (see pipeline line)` : "";
    const aiNote = state.searchMode !== "direct" && !useGemini && !useAnthropic
      ? " · No AI key for the selected search mode, so only the databases were searched." : "";
    if (!scored.length && !allPapers.length) {
      state.message = { type: "warn", text: "No papers found. Try expanding keywords or increasing the lookback period." + failNote + aiNote };
    } else if (!scored.length) {
      state.message = { type: "warn", text: `Found ${candidates.length} candidates but none passed the relevance filter (a tier 1/2 keyword phrase, 2+ keyword matches, or a watched author). Add keywords, lower Min Score, or check author spellings.` + failNote + aiNote };
    } else {
      const authMatches = scored.filter(x => x._hasAuthor).length;
      const kwMatches = scored.filter(x => x._hasCoreKw && !x._hasAuthor).length;
      const newCount = scored.filter(x => x._new).length;
      const duration = ((performance.now() - searchStart) / 1000).toFixed(1);
      state.message = { type: failed.length ? "warn" : "success", text: `Found ${scored.length} relevant papers (${newCount} new since last search) from ${candidates.length} unique candidates · ${authMatches} via authors · ${kwMatches} via keywords · ${duration}s` + failNote + aiNote };
    }
    state.pipelineInfo = Object.entries(state.sourceStatus).map(([k, s]) =>
      s.status === "error" ? `${k}: error (${s.error})` : `${k}: ${s.count}${s.note ? ` (${s.note})` : ""}`).join(" · ");
  } catch(e) {
    console.error(e);
    state.message = { type: "warn", text: "Search error: " + e.message };
  }
  state.searching = false; render();
}

const REVIEW_SYSTEM = `You are a Senior Research Scientist and Critical Auditor conducting a rigorous peer-style review.

OPERATING PRINCIPLES:
1. NULL HYPOTHESIS DEFAULT: Do not assume the paper's claims are correct. Actively look for methodological flaws, missing controls, alternative explanations, and over-stated conclusions.
2. 100% OBJECTIVITY: Present both supporting and opposing evidence. Do not try to agree with or contradict the authors — just assess the evidence.
3. CONFIDENCE TIERS: Tag each major assessment as [High Confidence], [Medium Confidence], or [Speculative].
4. HONESTY OVER COMPLETION: If you cannot assess something from the available information, state "Insufficient information to assess" rather than speculating.
5. CITATION: When referencing specific claims, indicate where in the paper they come from.
6. STUDY LIMITATIONS & BIASES: Explicitly mention sample sizes, statistical methods, potential confounds, funding sources, and any cherry-picked metrics.

Use web search to find and read the paper first. Then provide your review using EXACTLY this structure with these markdown headers:

## Summary
2-3 sentences on what the paper claims and its approach.

## Key Claims & Evidence
Numbered list of the paper's main claims. For each, state the supporting evidence AND note any gaps.

## Methodology Assessment
Evaluate experimental design, sample sizes, controls, statistical methods, reproducibility. Flag anything that weakens the conclusions.

## Strengths
What the paper does well — be specific and fair.

## Limitations & Potential Biases
Be thorough: small N, missing controls, confounds, funding conflicts, over-generalization, lack of replication, cherry-picked comparisons. Each item should be a specific, actionable critique.

## Context & Competing Work
How does this paper fit within the broader field? Are there contradictory findings? What did prior work show?

## Verdict
A balanced 2-3 sentence overall assessment. Include a confidence tier for the main conclusions.`;

async function generateReview(paper) {
  if (!state.apiKey) {
    return "**API key required for paper reviews.**\n\nGo to the Configure tab and enter your Anthropic API key. The review feature uses Claude with web search to fetch and critically analyze the full paper.\n\nThe key is stored only in your browser's localStorage.";
  }
  return callClaude(buildReviewPrompt(paper), REVIEW_SYSTEM, state.apiKey, { effort: "medium" });
}

function renderMarkdown(md) {
  // Minimal markdown → HTML renderer for the review panel.
  // Model output is untrusted (it read web pages), so escape everything before adding our own tags.
  let html = esc(String(md || "")).replace(/\r\n/g, "\n")
    .replace(/^#{3,} (.+)$/gm, '<h3 style="font-size:15px;color:var(--navy);margin:16px 0 6px">$1</h3>')
    .replace(/^#{1,2} (.+)$/gm, '<h2>$1</h2>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(?!\s)(.+?)\*/g, '<em>$1</em>')
    .replace(/\[High Confidence\]/g, '<span class="confidence-tag confidence-high">High Confidence</span>')
    .replace(/\[Medium Confidence\]/g, '<span class="confidence-tag confidence-med">Medium Confidence</span>')
    .replace(/\[Speculative\]/g, '<span class="confidence-tag confidence-low">Speculative</span>')
    .replace(/\[Low Confidence\]/g, '<span class="confidence-tag confidence-low">Low Confidence</span>')
    .replace(/\[Insufficient information[^\]]*\]/g, '<span class="confidence-tag confidence-low">Insufficient info</span>');

  // Convert numbered lists
  html = html.replace(/^(\d+)\.\s+(.+)$/gm, '<li>$2</li>');
  // Convert bullet lists
  html = html.replace(/^\s*[-•*]\s+(.+)$/gm, '<li>$1</li>');
  // Wrap consecutive <li> in <ul> or <ol>
  html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');
  // Convert remaining line breaks to paragraphs
  html = html.split('\n\n').map(block => {
    block = block.trim();
    if (block.startsWith('<h') || block.startsWith('<ul') || block.startsWith('<ol')) return block;
    if (block.trim() === '') return '';
    return `<p>${block.replace(/\n/g, '<br>')}</p>`;
  }).join('\n');

  return html;
}

function buildReviewPrompt(paper) {
  return `I need a rigorous, critical review of this scientific paper. Act as a Senior Research Scientist and Auditor.

**Paper:** ${paper.title}
**Authors:** ${paper.authors}
**Date:** ${paper.date}
**Source:** ${paper.source}
**URL:** ${paper.url}
${paper.doi ? `**DOI:** ${paper.doi}` : ""}

${paper.abstract ? `**Abstract:** ${paper.abstract}` : "Please search for this paper to find its abstract."}

Please search the web for this paper to get the full details, then provide your review using this EXACT structure:

## Summary
2-3 sentences: what the paper claims and its approach.

## Key Claims & Evidence
Numbered list. For each claim, state the evidence AND note gaps.

## Methodology Assessment
Evaluate experimental design, sample sizes, controls, statistical methods, reproducibility. Flag weaknesses.

## Strengths
Be specific and fair.

## Limitations & Potential Biases
Be thorough: small N, missing controls, confounds, funding conflicts, over-generalization, lack of replication, cherry-picked comparisons.

## Context & Competing Work
How does this fit the field? Contradictory findings? What did prior work show?

## Verdict
Balanced 2-3 sentence assessment. Tag confidence: [High Confidence], [Medium Confidence], or [Speculative].

RULES:
- Default to the null hypothesis — do not assume the claims are correct
- Present BOTH supporting and opposing evidence
- If you cannot assess something, say "Insufficient information" rather than guessing

}
